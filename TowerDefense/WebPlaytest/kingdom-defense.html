<title>Kingdom Defense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one landscape game surface. The 32x18 world is letterboxed into #app;
   HUD pills sit in the corners, menus are full-surface overlays. Single dark look. */
:root {
  color-scheme: dark;
  --ink: #f6eedb;          /* parchment text */
  --ink-dim: #c9bfa6;
  --night: #15131b;        /* letterbox / page ground */
  --panel: #2a2233;        /* the art palette's outline plum */
  --panel-2: #3a3046;
  --edge: #5a4a68;
  --gold: #ffc93c;
  --gold-deep: #c98a12;
  --blood: #e04848;
  --hero: #3d7be0;
  --branch-a: #e8553e;
  --branch-b: #2ec4b6;
  --ok: #5bd65b;
  --display: "Trebuchet MS", "Gill Sans", "Avenir Next", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { box-sizing: border-box; height: 100%; overflow: hidden; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.svg-i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex: none; }

/* ---------------------------------------------------------------- HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hud[hidden] { display: none !important; }
.corner { position: absolute; display: flex; gap: 6px; }
.tl { top: 6px; left: 0; flex-direction: column; align-items: flex-start; }
.tr { top: 6px; right: 0; }
.bl { bottom: 6px; left: 0; align-items: flex-end; }
.br { bottom: 6px; right: 0; align-items: flex-end; }
.pill {
  display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; min-height: 26px;
  background: rgba(30, 24, 38, 0.82); border: 1px solid rgba(255, 241, 208, 0.18); border-radius: 13px;
  font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap;
}
.pill .lbl { color: var(--ink-dim); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.pill.hit { animation: pillhit 0.4s ease-out; }
@keyframes pillhit { 0% { background: rgba(224, 72, 72, 0.9); } 100% { background: rgba(30, 24, 38, 0.82); } }
.pill.diff { font-size: 11px; color: var(--ink-dim); }
.ibtn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255, 241, 208, 0.22);
  background: rgba(42, 34, 51, 0.9); display: grid; place-items: center; font-weight: 800; font-size: 15px; padding: 0;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}
.ibtn:active { transform: translateY(1px); box-shadow: none; }
.ibtn .svg-i { width: 20px; height: 20px; }
#spd.s2 { background: #8a6512; } #spd.s3 { background: #8e2f3a; }
.skill {
  position: relative; width: 52px; height: 52px; border-radius: 50%; padding: 0; border: 2px solid rgba(255, 241, 208, 0.35);
  background: #2a2233; display: grid; place-items: center; overflow: visible; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
}
.skill canvas { width: 40px; height: 40px; position: relative; z-index: 1; border-radius: 50%; }
.skill .cd { position: absolute; inset: 0; z-index: 2; border-radius: 50%; pointer-events: none; }
.skill .cdt { position: absolute; z-index: 3; font-weight: 800; font-size: 14px; text-shadow: 0 1px 2px #000; pointer-events: none; }
.skill .tag { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); z-index: 3; font-size: 8.5px; font-weight: 800;
  letter-spacing: 0; text-transform: uppercase; background: rgba(21, 19, 27, 0.85); padding: 0 4px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
.skill.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 201, 60, 0.45); }
.skill.ready { border-color: rgba(255, 201, 60, 0.85); }
.skill .hpbar { position: absolute; left: 8px; right: 8px; bottom: 9px; height: 4px; background: rgba(0,0,0,0.6); border-radius: 2px; z-index: 3; pointer-events: none; }
.skill .hpbar i { display: block; height: 100%; width: 100%; background: var(--ok); border-radius: 2px; }
#wavebtn {
  position: relative; min-width: 104px; height: 52px; padding: 0 12px 0 10px; border-radius: 26px; border: 2px solid var(--gold);
  background: linear-gradient(#8e2f3a, #61202a); color: var(--ink); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
}
#wavebtn[hidden] { display: none !important; }
#wavebtn .ring { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; }
#wavebtn .ring span { width: 22px; height: 22px; border-radius: 50%; background: #3b1219; display: grid; place-items: center; font-size: 11px; }
#wavebtn .bonus { position: absolute; top: -10px; right: -4px; background: var(--gold); color: #3b2a05; font-size: 11px; font-weight: 900; border-radius: 9px; padding: 1px 6px; }
#wavebtn.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255, 201, 60, 0.35), 0 3px 0 rgba(0, 0, 0, 0.45); } }
#banner {
  position: absolute; left: 50%; top: 16%; transform: translateX(-50%); pointer-events: none !important; text-align: center;
  padding: 8px 22px; border-radius: 10px; background: rgba(21, 19, 27, 0.86); border: 1px solid rgba(255, 201, 60, 0.6);
  font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.04em; color: var(--gold); white-space: nowrap;
}
#banner small { display: block; font-family: var(--body); font-size: 12px; font-weight: 600; color: var(--ink); letter-spacing: 0; }
#banner.boss { border-color: var(--blood); color: #ff8a6a; }
#banner.show { animation: bannerin 0.35s ease-out; }
@keyframes bannerin { from { transform: translate(-50%, -12px) scale(0.92); opacity: 0; } }
#toast {
  position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); pointer-events: none !important; padding: 6px 14px; border-radius: 16px;
  background: rgba(21, 19, 27, 0.9); color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap;
}
#tut {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: min(380px, 50%); pointer-events: none !important;
  background: #fff1d0; color: #3a2a1a; border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); font-size: 13px; font-weight: 600; line-height: 1.3;
}
#tut b { font-size: 11px; color: #8a5a1a; white-space: nowrap; }
#tut button { pointer-events: auto; margin-left: auto; border: 0; background: #e3d2ad; border-radius: 8px; min-height: 32px; padding: 0 10px; font-weight: 800; color: #3a2a1a; }

/* ---------------------------------------------------------------- radial menu */
#radial { position: absolute; width: 0; height: 0; pointer-events: none !important; }
#radial .ring-bg { position: absolute; left: -66px; top: -66px; width: 132px; height: 132px; border-radius: 50%;
  border: 2px dashed rgba(255, 241, 208, 0.35); pointer-events: none; }
.rb {
  position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; padding: 0; pointer-events: auto;
  background: #3a3046; border: 2px solid #cdb98a; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
}
.rb img { width: 40px; height: 40px; pointer-events: none; }
.rb .svg-i { width: 22px; height: 22px; }
.rb .cost { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; white-space: nowrap;
  background: rgba(21, 19, 27, 0.92); color: var(--gold); border-radius: 7px; padding: 0 5px; pointer-events: none; font-variant-numeric: tabular-nums; }
.rb .nm { position: absolute; bottom: 47px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 800; white-space: nowrap;
  background: rgba(21, 19, 27, 0.92); color: var(--ink); border-radius: 6px; padding: 0 5px; pointer-events: none; }
.rb.na { filter: grayscale(1) brightness(0.7); }
.rb.na .cost { color: #b9a9a9; }
.rb.armed { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 201, 60, 0.5); }
.rb.armed::after { content: "\2713"; position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok);
  color: #0d2a0d; font-size: 12px; font-weight: 900; display: grid; place-items: center; }
.rb.ba { border-color: var(--branch-a); } .rb.bb { border-color: var(--branch-b); }
.rb.ba .nm { left: auto; right: 4px; transform: none; } .rb.bb .nm { left: 4px; transform: none; }
.rb.sell { background: #4a3a1e; } .rb.prio { background: #2b3a4e; font-size: 10px; font-weight: 800; line-height: 1.05; }
#info {
  position: absolute; top: 50%; transform: translateY(-50%); width: min(290px, 38%); pointer-events: none !important;
  background: rgba(30, 24, 38, 0.95); border: 1px solid rgba(255, 241, 208, 0.25); border-radius: 12px; padding: 8px 11px; font-size: 12px; line-height: 1.35;
}
#info h4 { margin: 0; font-family: var(--display); font-size: 15px; color: var(--gold); display: flex; justify-content: space-between; gap: 8px; }
#info h4 span { font-family: var(--body); font-size: 11px; color: var(--ink-dim); font-weight: 700; }
#info p { margin: 2px 0 4px; color: var(--ink-dim); }
#info .st { display: grid; grid-template-columns: repeat(4, auto); gap: 1px 10px; font-variant-numeric: tabular-nums; }
#info .st i { font-style: normal; color: var(--ink-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
#info .up { color: var(--ok); }
#info .hint { margin-top: 4px; font-weight: 700; color: var(--ink); }

/* ---------------------------------------------------------------- screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(16, 14, 22, 0.72); overflow-y: auto; padding-block: 8px; }
.screen[hidden] { display: none !important; }
.screen.solid { background: radial-gradient(ellipse at 50% 35%, rgba(42, 34, 51, 0.55), rgba(16, 14, 22, 0.92)); }
.title { font-family: var(--display); font-weight: 900; font-size: clamp(30px, 8vh, 60px); letter-spacing: 0.03em; color: var(--gold); margin: 0;
  text-shadow: 0 3px 0 #6e4526, 0 6px 18px rgba(0, 0, 0, 0.6); text-wrap: balance; text-align: center; line-height: 1; }
.sub { color: var(--ink); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; font-size: 12px; margin: 0; }
.btn {
  min-height: 46px; min-width: 120px; padding: 0 20px; border-radius: 12px; border: 2px solid #e3c47a; font-weight: 800; font-size: 15px;
  background: linear-gradient(#a8703e, #7c4c25); color: #fff6e3; box-shadow: 0 3px 0 #3a2312; letter-spacing: 0.02em;
}
.btn.alt { background: linear-gradient(#4a3e5a, #352b42); border-color: #8e7da6; box-shadow: 0 3px 0 #1a1420; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn[disabled] { opacity: 0.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.foot { color: var(--ink-dim); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.hdr { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 980px; }
.hdr h2 { margin: 0; font-family: var(--display); font-size: 20px; color: var(--gold); flex: 1; }
.levels { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 980px; }
.lv { flex: 1 1 0; min-width: 0; max-width: 190px; background: #2a2233; border: 2px solid #5a4a68; border-radius: 12px; padding: 0 0 7px; overflow: hidden;
  display: flex; flex-direction: column; gap: 4px; position: relative; text-align: left; }
.lv canvas { width: 100%; aspect-ratio: 16 / 9; display: block; max-width: 100%; }
.lv .nm { padding: 0 8px; font-family: var(--display); font-weight: 800; font-size: 13px; line-height: 1.15; min-height: 2.3em; }
.lv .nm small { display: block; color: var(--ink-dim); font-family: var(--body); font-weight: 600; font-size: 10px; }
.lv .stars { padding: 0 8px; display: flex; gap: 2px; color: #4d4258; }
.lv .stars .on { color: var(--gold); }
.lv .md { padding: 0 8px; display: flex; gap: 6px; font-size: 10px; color: var(--ink-dim); font-weight: 700; font-variant-numeric: tabular-nums; }
.lv .md b { color: var(--gold); }
.lv .acts { padding: 0 6px; display: flex; gap: 5px; }
.lv .acts button { flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid #cdb98a; background: #7c4c25; font-weight: 800; font-size: 12px; padding: 0 4px; }
.lv .acts button.e { background: #352b42; border-color: #8e7da6; }
.lv .acts button[disabled] { opacity: 0.35; }
.lv.locked canvas { filter: grayscale(1) brightness(0.45); }
.lv .lock { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 16 / 9; display: grid; place-items: center; text-align: center; font-size: 11px;
  font-weight: 700; color: var(--ink); padding: 6px; }
.lv .lock .svg-i { width: 22px; height: 22px; display: block; margin: 0 auto 2px; }
.modal { background: #2a2233; border: 2px solid #8e7da6; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  align-items: center; max-width: min(960px, 100%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); }
.modal h3 { margin: 0; font-family: var(--display); font-size: 20px; color: var(--gold); text-align: center; }
.modal h3 small { display: block; font-family: var(--body); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.18em; text-transform: uppercase; }
.diffs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.dc { position: relative; text-align: left; border-radius: 12px; border: 2px solid #5a4a68; background: #352b42; padding: 8px 9px; display: flex; flex-direction: column;
  gap: 3px; min-height: 140px; min-width: 0; }
.dc b { font-family: var(--display); font-size: 16px; }
.dc ul { margin: 0; padding: 0; list-style: none; font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.dc p { margin: 0; font-size: 10.5px; color: var(--ink-dim); line-height: 1.3; }
.dc .best { margin-top: auto; display: flex; gap: 2px; color: #4d4258; font-size: 11px; font-weight: 700; align-items: center; }
.dc .best .on { color: var(--gold); }
.dc.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 201, 60, 0.35); background: #43364f; }
.dc.locked { opacity: 0.55; }
.dc .lk { color: #ff9c8a; font-size: 11px; font-weight: 800; }
.dc[data-m="Easy"] b { color: #8fe08f; } .dc[data-m="Normal"] b { color: #ffe08a; } .dc[data-m="Hard"] b { color: #ffa36a; } .dc[data-m="Impossible"] b { color: #ff6a7a; }
.bigstars { display: flex; gap: 8px; }
.bigstars .svg-i { width: 54px; height: 54px; color: #4d4258; }
.bigstars .on .svg-i { color: var(--gold); }
.bigstars .on { animation: starpop 0.45s cubic-bezier(.3, 1.6, .5, 1) both; }
.bigstars .on:nth-child(2) { animation-delay: 0.18s; } .bigstars .on:nth-child(3) { animation-delay: 0.36s; }
@keyframes starpop { from { transform: scale(0.2) rotate(-40deg); opacity: 0; } }
.res { font-size: 13px; color: var(--ink); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.res .h { color: var(--gold); font-weight: 800; display: block; }
#rotate { position: absolute; inset: 0; z-index: 50; background: var(--night); display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 24px; font-weight: 700; }
#rotate .ph { width: 46px; height: 76px; border: 4px solid var(--gold); border-radius: 9px; animation: rot 2.2s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
@media (max-height: 360px) { .dc { min-height: 0; } .dc p { display: none; } .lv .md { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  #rotate .ph { transform: rotate(-90deg); }
}
</style>

<div id="app">
  <canvas id="cv" aria-label="Kingdom Defense battlefield"></canvas>

  <div id="hud" hidden>
    <div class="corner tl">
      <div class="pill" id="pLives" title="Lives"></div>
      <div class="pill" id="pGold" title="Gold"></div>
      <div class="pill" id="pWave" title="Wave"></div>
      <div class="pill diff" id="pDiff"></div>
    </div>
    <div class="corner tr">
      <button class="ibtn" id="mute" aria-label="Sound on or off"></button>
      <button class="ibtn" id="spd" aria-label="Game speed">1x</button>
      <button class="ibtn" id="pause" aria-label="Pause"></button>
    </div>
    <div class="corner bl">
      <button class="skill" id="heroBtn" aria-label="Select hero"><canvas width="80" height="80"></canvas><div class="hpbar"><i></i></div><div class="cd"></div><span class="cdt"></span><span class="tag">Hero</span></button>
      <button class="skill" id="abilBtn" aria-label="Hero ability: Shockwave"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="cdt"></span><span class="tag">Shockwave</span></button>
      <button class="skill" id="barBtn" aria-label="Barricade spell"><canvas width="80" height="80"></canvas><div class="cd"></div><span class="cdt"></span><span class="tag">Barricade</span></button>
    </div>
    <div class="corner br">
      <button id="wavebtn" aria-label="Call next wave"><span class="ring"><span id="wvNum"></span></span><span id="wvTxt">Call wave</span><span class="bonus" id="wvBonus" hidden></span></button>
    </div>
    <div id="info" hidden></div>
    <div id="radial" hidden></div>
    <div id="banner" hidden></div>
    <div id="toast" hidden></div>
    <div id="tut" hidden><b id="tutN"></b><span id="tutT"></span><button id="tutSkip">Skip</button></div>
  </div>

  <section class="screen solid" id="scrMenu" hidden>
    <p class="sub">Hold the line</p>
    <h1 class="title">Kingdom Defense</h1>
    <div class="row">
      <button class="btn" id="bPlay">Play campaign</button>
      <button class="btn alt" id="bSound">Sound: on</button>
    </div>
    <div class="foot" id="menuFoot"></div>
  </section>

  <section class="screen solid" id="scrLevels" hidden>
    <div class="hdr"><button class="btn alt" id="bBack" style="min-width:0">Back</button><h2>Campaign</h2><div class="foot" id="lvFoot"></div></div>
    <div class="levels" id="lvList"></div>
  </section>

  <section class="screen" id="scrDiff" hidden>
    <div class="modal">
      <h3 id="dTitle"></h3>
      <div class="diffs" id="dList"></div>
      <div class="row"><button class="btn alt" id="dBack">Back</button><button class="btn" id="dStart">Start</button></div>
    </div>
  </section>

  <section class="screen" id="scrPause" hidden>
    <div class="modal">
      <h3>Paused<small id="pzSub"></small></h3>
      <div class="row">
        <button class="btn" id="pzResume">Resume</button>
        <button class="btn alt" id="pzRestart">Restart</button>
        <button class="btn alt" id="pzQuit">Quit to menu</button>
      </div>
      <div class="row" id="pzConfirm" hidden><span class="res" id="pzAsk"></span><button class="btn" id="pzYes">Yes</button><button class="btn alt" id="pzNo">No</button></div>
    </div>
  </section>

  <section class="screen" id="scrResult" hidden>
    <div class="modal">
      <h3 id="rTitle"></h3>
      <div class="bigstars" id="rStars"></div>
      <div class="res" id="rText"></div>
      <div class="row">
        <button class="btn" id="rNext">Next level</button>
        <button class="btn alt" id="rRetry">Retry</button>
        <button class="btn alt" id="rMenu">Level select</button>
      </div>
    </div>
  </section>

// ------------------------------------------------------------------ self-check against the C# export
function selfCheck() {
  const out = [], C = DATA.checks;
  const near = (a, b, tol = 1e-5) => Math.abs(a - b) <= tol * Math.max(1, Math.abs(b));
  const ok = (name, pass, detail) => out.push({ name, pass: !!pass, detail });
  for (const m of MODES) {
    const exp = C.wave10HealthMeadowCitadelAndCitadelSpeed[m];
    const got = [healthAt(buildCurve(LEVELS.meadow, m), 10), healthAt(buildCurve(LEVELS.citadel, m), 10), speedAt(buildCurve(LEVELS.citadel, m), 10)];
    ok("wave 10 health/speed " + m, got.every((g, i) => near(g, exp[i])), got.join(", ") + " vs " + exp.join(", "));
  }
  for (const p of C.plans) {
    const L = LEVELS[p.level];
    const plan = planWave(p.wave, buildCurve(L, p.mode), L.enemyPool.map((id) => typeInfo(ENEMIES[id])),
      L.bossPool.map((id) => typeInfo(ENEMIES[id], p.mode)), L.paths.length, p.seed);
    const got = plan.spawns.map((s) => [s.boss ? L.bossPool[s.type] : L.enemyPool[s.type], s.health, s.speed, s.reward, s.delay, s.path]);
    const same = got.length === p.spawns.length && got.every((g, i) => g[0] === p.spawns[i][0] && near(g[1], p.spawns[i][1]) &&
      near(g[2], p.spawns[i][2]) && g[3] === p.spawns[i][3] && near(g[4], p.spawns[i][4]) && g[5] === p.spawns[i][5]);
    ok(`plan ${p.level} ${p.mode} wave ${p.wave} seed ${p.seed}`, same && plan.boss === p.boss && plan.totalReward === p.totalReward,
      `${got.length} spawns, total HP ${plan.totalHealth.toFixed(3)} vs ${p.totalHealth.toFixed(3)}, gold ${plan.totalReward} vs ${p.totalReward}`);
  }
  for (const [start, row] of Object.entries(C.stars)) {
    const got = row.map((_, lives) => starRate(lives, +start));
    ok("stars on " + start + " lives", got.join() === row.join(), got.join(""));
  }
  for (const [id, rows] of Object.entries(C.startGoldLives)) {
    const got = MODES.map((m) => [applyGold(DIFF[m], LEVELS[id].gold), applyLives(DIFF[m], LEVELS[id].lives)]);
    ok("start gold/lives " + id, JSON.stringify(got) === JSON.stringify(rows), JSON.stringify(got));
  }
  const kr = [killReward(5, 1, f32(0.05)), killReward(5, 10, f32(0.05)), killReward(5, 20, f32(0.05), 12 / 5), killReward(5, 7, f32(0.05), 9 / (5 / 0.9))];
  ok("kill rewards", kr.join() === C.killReward.join(), kr.join());
  const eb = [earlyCallBonus(3.4, 2), earlyCallBonus(5, 2), earlyCallBonus(1.25, 2)];
  ok("early-call bonus", eb.join() === C.earlyBonus.join(), eb.join());
  for (const t of DATA.towers) {
    let pass = true;
    for (const k of ["1", "2", "3", "A", "B"]) {
      const s = statsAt(t.spec, k === "A" || k === "B" ? 4 : +k, k);
      const e = t.stats[k];
      if (!near(s.damage, e.damage, 1e-6) || !near(s.range, e.range, 1e-6) || !near(s.fireRate, e.fireRate, 1e-6) || !near(s.splash, e.splash, 1e-6) ||
        !near(s.poisonDps, e.poisonDps, 1e-6) || s.slow !== e.slow) pass = false;
      const invested = t.cost.build + (k !== "1" ? t.cost.l2 : 0) + (k === "3" || k === "A" || k === "B" ? t.cost.l3 : 0) + (k === "A" || k === "B" ? t.cost[k] : 0);
      if (sellRefund(invested, f32(DATA.sellRefund)) !== t.sell[k]) pass = false;
    }
    ok("tower stats/sell " + t.id, pass, "L3 DPS " + t.stats["3"].dps.toFixed(3));
  }
  return { pass: out.every((o) => o.pass), checks: out };
}

      for (let i = 0; i < 3; i++) {
        const ph = (time * 0.8 + i / 3) % 1;
        c.save(); c.globalAlpha = 0.6 * (1 - ph); ellipse(c, x + 0.35 + Math.sin(ph * 6 + i) * 0.1, top - 0.2 - ph * 0.8, 0.08 + ph * 0.12, 0.08 + ph * 0.12, ART.toxic); c.restore();
      }
      // flask on the roof
      poly(c, [x - 0.2, top + 0.25, x - 0.07, top - 0.05, x - 0.07, top - 0.22, x + 0.07, top - 0.22, x + 0.07, top - 0.05, x + 0.2, top + 0.25], br === "B" ? "#d7ff6a" : ART.toxic, ART.outline, 0.04);
      if (lv >= 2) for (const s of [-1, 1]) ellipse(c, x + s * 0.62, y - 0.05, 0.13, 0.17, "#6b4a2a", ART.outline, 0.03);
      break;
    }
  }
  // level pips (3) and the elite crown
  for (let i = 0; i < 3; i++) {
    const px = x + (i - 1) * 0.3, py = y + 0.42, on = i < Math.min(lv, 3);
    ellipse(c, px, py, 0.1, 0.1, on ? (elite ? bc : ART.gold) : "#3a3046", ART.outline, 0.035);
  }
  if (elite) crown(c, x, top - (t.id === "frost" ? 0.95 : t.id === "mage" ? 1.25 : 0.75), 0.42, ART.gold);
}

// ------------------------------------------------------------------ enemies
function drawEnemy(c, e, time) {
  const d = e.def, vs = d.scale, r = 0.36 * vs, fly = d.flying;
  const x = e.x, gy = 18 - e.y;
  const walk = e.walk || 0, bob = fly ? Math.sin(time * 5 + e.uid) * 0.06 : Math.abs(Math.sin(walk * 5)) * 0.06 * vs;
  const lift = fly ? 0.75 + (d.boss ? 0.4 : 0) : 0;
  ellipse(c, x, gy + r * 0.55, r * (fly ? 0.8 : 1.05), r * 0.35, "rgba(0,0,0," + (fly ? 0.18 : 0.28) + ")");
  const y = gy - lift - bob;
  const face = e.dir[0] < -0.1 ? -1 : 1;
  c.save(); c.translate(x, y); c.scale(face, 1);
  let body = d.tint;
  if (e.hitT > 0) body = "#ffffff";
  const out = ART.outline, lw = 0.05;
  switch (d.id) {
    case "bat": case "wyvern": case "drake": {
      const flap = Math.sin(time * (d.id === "bat" ? 18 : 9) + e.uid) * 0.5;
      const ww = r * (d.id === "bat" ? 2.3 : 2.6), wh = r * 1.2;
      for (const s of [-1, 1]) poly(c, [s * r * 0.3, -r * 0.2, s * ww, -r * 0.4 - flap * wh, s * ww * 0.75, r * 0.2, s * ww * 0.4, r * 0.05, s * r * 0.3, r * 0.3], shade(d.tint, -0.15), out, lw);
      if (d.id !== "bat") poly(c, [-r * 0.6, r * 0.2, -r * 1.6, r * 0.6, -r * 0.6, r * 0.5], shade(d.tint, -0.1), out, lw);
      ellipse(c, 0, 0, r * 0.75, r * 0.6, body, out, lw);
      if (d.id === "bat") { poly(c, [-r * 0.4, -r * 0.4, -r * 0.25, -r * 0.95, -r * 0.05, -r * 0.5], body, out, lw); poly(c, [r * 0.4, -r * 0.4, r * 0.25, -r * 0.95, r * 0.05, -r * 0.5], body, out, lw); }
      else { ellipse(c, r * 0.75, -r * 0.35, r * 0.42, r * 0.32, body, out, lw); poly(c, [r * 0.6, -r * 0.6, r * 0.45, -r * 1.05, r * 0.85, -r * 0.62], "#f1e3c0", out, 0.03); }
      ellipse(c, r * (d.id === "bat" ? 0.25 : 0.95), -r * (d.id === "bat" ? 0.15 : 0.4), r * 0.1, r * 0.1, d.id === "drake" ? ART.fire : "#ffe36a");
      break;
    }
    case "splitter": case "slimeling": {
      const wob = Math.sin(time * 6 + e.uid) * 0.06;
      ellipse(c, 0, r * 0.1, r * (1 + wob), r * (0.85 - wob), body, out, lw);
      ellipse(c, -r * 0.3, -r * 0.25, r * 0.22, r * 0.14, "rgba(255,255,255,0.45)");
      ellipse(c, r * 0.25, -r * 0.05, r * 0.12, r * 0.14, out); ellipse(c, r * 0.55, -r * 0.05, r * 0.1, r * 0.13, out);
      break;
    }
    case "spiderling": case "broodmother": {
      c.strokeStyle = out; c.lineWidth = d.boss ? 0.09 : 0.05; c.lineCap = "round";
      for (let i = 0; i < 4; i++) for (const s of [-1, 1]) {
        const ph = Math.sin(walk * 9 + i * 1.3) * 0.15;
        c.beginPath(); c.moveTo(s * r * 0.3, r * 0.1); c.lineTo(s * r * (0.9 + i * 0.12), -r * (0.35 - i * 0.2) + ph); c.lineTo(s * r * (1.15 + i * 0.1), r * (0.55 + i * 0.05)); c.stroke();
      }
      ellipse(c, -r * 0.35, 0, r * 0.75, r * 0.6, body, out, lw);
      if (d.boss) { ellipse(c, -r * 0.35, -r * 0.05, r * 0.35, r * 0.25, "#b0304a"); }
      ellipse(c, r * 0.45, -r * 0.05, r * 0.42, r * 0.38, shade(d.tint, 0.15), out, lw);
      for (let i = 0; i < 3; i++) ellipse(c, r * (0.55 + i * 0.1), -r * (0.18 - (i % 2) * 0.08), r * 0.06, r * 0.06, "#ff4a4a");
      break;
    }
    case "runner": {
      ellipse(c, 0, r * 0.25, r * 1.05, r * 0.5, "#6a5a4c", out, lw); // worg
      ellipse(c, r * 0.95, 0, r * 0.4, r * 0.3, "#6a5a4c", out, lw);
      poly(c, [r * 0.85, -r * 0.2, r * 0.95, -r * 0.55, r * 1.1, -r * 0.2], "#6a5a4c", out, 0.03);
      ellipse(c, r * 1.12, -r * 0.05, r * 0.06, r * 0.06, "#ffe36a");
      ellipse(c, -r * 0.05, -r * 0.45, r * 0.38, r * 0.42, "#6ba34a", out, lw); // rider
      ellipse(c, r * 0.12, -r * 0.55, r * 0.07, r * 0.07, out);
      break;
    }
    default: {
      // humanoids: grunt, brute, shaman, knight, warder, troll, skeleton, warlord, necromancer
      const big = d.id === "troll" || d.id === "brute" || d.id === "warlord";
      ellipse(c, 0, r * 0.15, r * (big ? 0.95 : 0.8), r * 0.85, body, out, lw);
      if (d.id === "warder" || d.id === "necromancer") poly(c, [-r * 0.85, r * 0.95, 0, -r * 1.15, r * 0.85, r * 0.95], body, out, lw);
      const hx = r * 0.15, hy = -r * 0.75;
      if (d.id === "knight") {
        rrect(c, -r * 0.45, hy - r * 0.45, r * 0.9, r * 0.8, r * 0.25, "#8a93a6", out, lw);
        rrect(c, -r * 0.1, hy - r * 0.15, r * 0.5, r * 0.08, 0.02, out);
        poly(c, [-r * 0.1, hy - r * 0.45, -r * 0.4, hy - r * 0.95, r * 0.05, hy - r * 0.5], ART.blood, out, 0.03);
        rrect(c, r * 0.35, -r * 0.2, r * 0.4, r * 0.75, r * 0.12, "#3b4252", out, lw);
      } else {
        const skin = d.id === "skeleton" ? "#efeadb" : d.id === "warder" || d.id === "necromancer" ? "#2a1f33" : shade(d.tint, 0.18);
        ellipse(c, hx, hy, r * 0.48, r * 0.44, skin, out, lw);
        if (d.id === "grunt" || d.id === "shaman" || d.id === "warlord") for (const s of [-1, 1]) poly(c, [hx + s * r * 0.4, hy - r * 0.05, hx + s * r * 0.95, hy - r * 0.35, hx + s * r * 0.4, hy + r * 0.15], skin, out, 0.03);
        const eye = d.id === "warder" || d.id === "necromancer" ? "#ff5ad0" : d.id === "skeleton" ? out : "#ffe36a";
        ellipse(c, hx + r * 0.18, hy - r * 0.02, r * 0.08, r * 0.08, eye); ellipse(c, hx - r * 0.08, hy - r * 0.02, r * 0.07, r * 0.07, eye);
        if (d.id === "brute" || d.id === "troll" || d.id === "warlord") for (const s of [0, 1]) poly(c, [hx + r * (0.0 + s * 0.25), hy + r * 0.2, hx + r * (0.05 + s * 0.25), hy - r * 0.05, hx + r * (0.12 + s * 0.25), hy + r * 0.2], "#fff1d0");
        if (d.id === "warlord") poly(c, [hx - r * 0.45, hy - r * 0.25, hx - r * 0.7, hy - r * 0.95, hx - r * 0.15, hy - r * 0.42], "#e8e0c8", out, 0.03);
      }
      // held items
      c.strokeStyle = ART.woodDark; c.lineWidth = Math.max(0.05, r * 0.14); c.lineCap = "round";
      if (d.id === "shaman" || d.id === "necromancer") {
        c.beginPath(); c.moveTo(r * 0.75, r * 0.8); c.lineTo(r * 0.75, -r * 1.2); c.stroke();
        ellipse(c, r * 0.75, -r * 1.3, r * 0.2, r * 0.2, d.id === "shaman" ? "#5ff0d0" : "#efeadb", out, 0.03);
      } else if (d.id === "troll" || d.id === "brute" || d.id === "warlord") {
        const sw = e.blocked ? Math.sin(time * 8) * 0.5 : 0;
        c.save(); c.translate(r * 0.7, 0); c.rotate(-0.6 + sw);
        c.beginPath(); c.moveTo(0, r * 0.5); c.lineTo(0, -r * 0.9); c.stroke();
        if (d.id === "warlord") poly(c, [0, -r * 0.9, r * 0.6, -r * 1.1, r * 0.55, -r * 0.4, 0, -r * 0.55], "#c9c9d6", out, 0.03);
        else ellipse(c, 0, -r * 0.9, r * 0.25, r * 0.3, ART.woodDark, out, 0.03);
        c.restore();
      } else if (d.id === "grunt" || d.id === "skeleton") {
        c.strokeStyle = "#c9c9d6"; c.lineWidth = 0.05; c.beginPath(); c.moveTo(r * 0.6, r * 0.2); c.lineTo(r * 1.0, -r * 0.35); c.stroke();
      }
    }
  }
  c.restore();
  // status overlays
  if (e.shield) { c.save(); c.globalAlpha = 0.35 + 0.15 * Math.sin(time * 10); ellipse(c, x, y - r * 0.1, r * 1.45, r * 1.45, "#c890ff", "#f0d8ff", 0.06); c.restore(); }
  if (e.slow < 1) { c.save(); c.globalAlpha = 0.45; ellipse(c, x, y, r * 0.9, r * 0.8, ART.slow); c.restore(); }
  if (e.poisonT > 0) for (let i = 0; i < 2; i++) { const ph = (time * 1.4 + i * 0.5 + e.uid * 0.13) % 1; c.save(); c.globalAlpha = 1 - ph; ellipse(c, x + (i ? 0.15 : -0.12) * vs, y - r - ph * 0.5, 0.06, 0.06, ART.poisonTint); c.restore(); }
  if (e.enraged) { c.save(); c.globalAlpha = 0.25 + 0.15 * Math.sin(time * 12); ellipse(c, x, y, r * 1.2, r * 1.1, ART.blood); c.restore(); }
  if (d.boss) crown(c, x, y - r * (d.flying ? 0.95 : 1.55), 0.42 + vs * 0.08, ART.gold);
  // health bar
  const f = clamp(e.hp / e.maxHp, 0, 1);
  if (f < 1 || d.boss) {
    const bw = d.boss ? 1.5 : Math.max(0.6, 0.85 * vs), by = y - r * (d.boss ? 2.2 : 1.85) - (d.flying ? 0 : 0.1);
    rrect(c, x - bw / 2 - 0.03, by - 0.03, bw + 0.06, 0.18, 0.05, "rgba(42,34,51,0.9)");
    rrect(c, x - bw / 2, by, bw * f, 0.12, 0.04, hpColor(f));
  }
}

// ------------------------------------------------------------------ hero, barricade
function drawHero(c, h, time, selected) {

  ellipse(c, x, y + 0.15, 0.48, 0.2, "rgba(0,0,0,0.3)");
  const face = h.face < 0 ? -1 : 1, step = h.moving ? Math.sin(time * 14) * 0.06 : 0;
  c.save(); c.translate(x, y - step); c.scale(face, 1);
  poly(c, [-0.32, -0.55, -0.48, 0.12, 0.05, 0.05], "#b82e3e", ART.outline, 0.04); // cape
  rrect(c, -0.3, -0.62, 0.6, 0.72, 0.2, ART.hero, ART.outline, 0.05);
  rrect(c, -0.3, -0.18, 0.6, 0.1, 0.03, ART.gold);
  ellipse(c, 0.02, -0.85, 0.27, 0.26, "#c0c6d2", ART.outline, 0.05); // helm
  rrect(c, 0.02, -0.88, 0.24, 0.06, 0.02, ART.outline);
  poly(c, [-0.05, -1.08, -0.2, -1.38, 0.12, -1.1], ART.gold, ART.outline, 0.03);

  c.save(); c.translate(0.28, -0.35); c.rotate(swing);
  rrect(c, -0.03, -0.72, 0.07, 0.68, 0.02, "#e8eef8", ART.outline, 0.03); rrect(c, -0.11, -0.06, 0.22, 0.06, 0.02, ART.gold);
  c.restore();
  ellipse(c, -0.28, -0.3, 0.2, 0.24, "#2f5fb0", ART.outline, 0.04); // shield
  star5(c, -0.28, -0.3, 0.1, ART.gold);
  c.restore();
  const f = clamp(h.hp / HERO.hp, 0, 1);
  rrect(c, x - 0.43, y - 1.62, 0.86, 0.17, 0.05, "rgba(42,34,51,0.9)");

}
function drawHeroGhost(c, h, time) {
  const x = h.homeX, y = 18 - h.homeY, f = 1 - h.respawnT / HERO.respawn;
  c.save(); c.globalAlpha = 0.35; rrect(c, x - 0.3, y - 0.62, 0.6, 0.72, 0.2, "#bfe0ff"); ellipse(c, x, y - 0.85, 0.27, 0.26, "#bfe0ff"); c.restore();
  c.beginPath(); c.arc(x, y - 0.3, 0.55, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); c.strokeStyle = "#bfe0ff"; c.lineWidth = 0.08; c.stroke();
}
function drawBarricade(c, b) {
  const x = b.x, y = 18 - b.y, f = b.hp / BARRICADE.hp;
  ellipse(c, x, y + 0.12, 0.75, 0.22, "rgba(0,0,0,0.28)");
  for (let i = -2; i <= 2; i++) {

  }
  for (const yy of [-0.2, -0.45]) rrect(c, x - 0.72, y + yy, 1.44, 0.1, 0.03, ART.woodDark, ART.outline, 0.03);
  if (f < 0.66) { c.strokeStyle = ART.outline; c.lineWidth = 0.035; c.beginPath(); c.moveTo(x - 0.3, y - 0.5); c.lineTo(x - 0.18, y - 0.25); c.lineTo(x - 0.3, y - 0.05); if (f < 0.33) { c.moveTo(x + 0.3, y - 0.6); c.lineTo(x + 0.4, y - 0.3); c.lineTo(x + 0.28, y - 0.1); } c.stroke(); }
}

// ------------------------------------------------------------------ projectiles
function drawProjectile(c, p) {
  const x = p.x, y = 18 - p.y, a = -p.ang;
  c.save(); c.translate(x, y);
  switch (p.kind) {
    case "arrow":
      c.rotate(a); c.strokeStyle = ART.woodDark; c.lineWidth = 0.05; c.beginPath(); c.moveTo(-0.35, 0); c.lineTo(0.2, 0); c.stroke();
      poly(c, [0.32, 0, 0.16, -0.08, 0.16, 0.08], "#d8dce6"); poly(c, [-0.35, 0, -0.45, -0.08, -0.3, 0, -0.45, 0.08], "#f0e6d0");
      break;
    case "shard":
      c.rotate(a); c.save(); c.globalAlpha = 0.35; ellipse(c, -0.2, 0, 0.3, 0.08, ART.ice); c.restore();
      poly(c, [0.28, 0, 0, -0.1, -0.2, 0, 0, 0.1], ART.ice, "#5aa6d6", 0.03);
      break;
    case "orb":
      c.save(); c.globalAlpha = 0.35; ellipse(c, 0, 0, 0.3, 0.3, ART.magic); c.restore();
      ellipse(c, 0, 0, 0.15, 0.15, p.tint || ART.magic, "#fff", 0.03);
      break;
    case "shell":
      ellipse(c, 0, 0, 0.17, 0.17, "#333038", ART.outline, 0.03); ellipse(c, -0.05, -0.05, 0.05, 0.05, "#8a8790");
      break;
    case "flask":
      c.rotate(p.spin);
      poly(c, [-0.14, 0.14, -0.05, -0.04, -0.05, -0.16, 0.05, -0.16, 0.05, -0.04, 0.14, 0.14], ART.toxic, ART.outline, 0.03);
      break;
  }
  c.restore();
}

// ================================================================== combat simulation
// Mirrors the Unity runtime scripts: WaveManager (wave loop), Enemy (path, armor, block, slow/poison),
// Tower (targeting, cadence, hits), Projectile (homing / lobbed, splash on landing), HeroUnit, Barricade
// and the Bosses/Abilities behaviours. World units, y up, (0,0) bottom-left.

let UID = 0;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function pathData(flat) {
  const pts = [];
  for (let i = 0; i < flat.length; i += 2) pts.push([flat[i], flat[i + 1]]);
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return { pts, len };
}
// Enemy.DistanceAlongPathTo: distance along the path to `pos` while heading for waypoint `index`.
function distAlong(path, index, x, y) {
  const p = path.pts;
  let d = 0;
  const last = Math.min(index, p.length - 1);
  for (let i = 1; i <= last; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
  if (index > 0 && index < p.length) d -= Math.hypot(x - p[index][0], y - p[index][1]);
  return Math.max(0, d);
}
// PathUtility.TryProjectOntoPaths
function projectOntoPaths(paths, x, y, maxDist) {
  let best = maxDist * maxDist, hit = null;
  for (const path of paths) for (let i = 0; i + 1 < path.pts.length; i++) {
    const [a, b] = [path.pts[i], path.pts[i + 1]];
    const [, cx, cy] = segDist(x, y, a[0], a[1], b[0], b[1]);
    const d = dist2(x, y, cx, cy);
    if (d <= best) { best = d; hit = { x: cx, y: cy }; }
  }
  return hit;
}

class Game {
  constructor(level, mode, hooks) {
    this.level = level; this.mode = mode; this.rules = DIFF[mode]; this.hooks = hooks || {};
    this.paths = level.paths.map(pathData);
    this.curve = buildCurve(level, mode);
    this.types = level.enemyPool.map((id) => typeInfo(ENEMIES[id]));
    this.bossTypes = level.bossPool.map((id) => typeInfo(ENEMIES[id], mode));
    this.seed = ((Math.random() * 0x7fffffff) | 0) || 1;
    this.gold = applyGold(this.rules, level.gold);
    this.lives = this.startLives = applyLives(this.rules, level.lives);
    this.wave = 0; this.wavesToWin = level.waves;
    this.state = "countdown"; this.timer = WAVE_MANAGER.delayBetweenWaves; this.holdFirst = true;
    this.enemies = []; this.projectiles = []; this.barricades = []; this.fx = []; this.texts = [];
    this.towers = level.slots.map(() => null);
    this.time = 0; this.kills = 0; this.leaked = 0; this.barCd = 0; this.shake = 0;
    const hs = level.hero;
    this.hero = { x: hs[0], y: hs[1], homeX: hs[0], homeY: hs[1], tx: hs[0], ty: hs[1], hp: HERO.hp, dead: false, moving: false,
      respawnT: 0, abilityT: 0, atkT: 0, engaged: null, engagedUid: 0, owns: false, face: 1, swing: 0, uid: ++UID };
  }
  emit(name, a, b) { const f = this.hooks[name]; if (f) f(a, b); }
  get over() { return this.state === "won" || this.state === "lost"; }
  get countingDown() { return this.state === "countdown" && this.enemies.length === 0 && this.timer > 0; }
  get earlyBonusPreview() { return this.countingDown && this.rules.early ? earlyCallBonus(this.timer, WAVE_MANAGER.earlyCallGoldPerSecond) : 0; }

  // ------------------------------------------------------------ wave loop (WaveManager.RunForever)
  callEarly() {
    if (!this.countingDown) return -1;
    const bonus = this.earlyBonusPreview;
    if (bonus > 0) { this.gold += bonus; this.emit("gold", bonus); }
    this.timer = 0; this.holdFirst = false;
    return bonus;
  }
  startWave() {
    this.wave++;
    this.plan = planWave(this.wave, this.curve, this.types, this.bossTypes, this.paths.length, this.seed);
    this.state = "spawning"; this.spawnIdx = 0; this.spawnWait = 0; this.spawnLoaded = false;
    const bossSpawn = this.plan.spawns.find((s) => s.boss);
    this.emit("wave", this.wave, bossSpawn ? ENEMIES[this.level.bossPool[bossSpawn.type]] : null);
  }
  updateWaves(dt) {
    if (this.state === "countdown") {
      if (this.wave === 0 && this.holdFirst) return; // web port: wave 1 waits for the first build or a call
      this.timer -= dt;
      if (this.timer <= 0) { this.timer = 0; this.startWave(); }
      return;
    }
    if (this.state === "spawning") {

  // ------------------------------------------------------------ towers (Tower.cs)

}

// ------------------------------------------------------------------ rendering
function render(now) {
  const time = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const level = G ? G.level : LEVELS[UI.menuLevel] || LEVELS.meadow;
  ensureMap(level);
  let shx = 0, shy = 0;
  if (G && G.shake > 0 && !REDUCED) { shx = (Math.random() - 0.5) * G.shake * 0.5 * view.S; shy = (Math.random() - 0.5) * G.shake * 0.5 * view.S; }
  ctx.drawImage(mapLayer, shx * view.dpr, shy * view.dpr);
  const k = view.S * view.dpr;
  ctx.setTransform(k, 0, 0, k, (view.ox + shx) * view.dpr, (view.oy + shy) * view.dpr);
  if (!G) { for (const s of level.slots) drawSlot(ctx, s[0], 18 - s[1], false); return; }
  const g = G, gt = g.time;
  // incoming-wave markers at the spawns
  if (g.countingDown || (g.state === "spawning" && g.spawnIdx < 2)) {
    const seen = new Set();
    for (const p of g.level.paths) {
      const e = edgePoint(p, true), key = Math.round(e.x) + "," + Math.round(e.y);
      if (seen.has(key)) continue; seen.add(key);
      const pulse = 0.55 + 0.45 * Math.sin(time * 6);
      ctx.save(); ctx.globalAlpha = pulse;
      ellipse(ctx, e.x + e.dx * 0.6, e.y + e.dy * 0.6, 0.55, 0.55, "rgba(142,47,58,0.9)", ART.gold, 0.07);
      ctx.translate(e.x + e.dx * 0.6, e.y + e.dy * 0.6); ctx.rotate(Math.atan2(e.dy, e.dx));
      poly(ctx, [-0.2, -0.28, 0.25, 0, -0.2, 0.28], ART.gold);
      ctx.restore();
    }
  }
  // road highlight while placing the hero or a barricade
  if (UI.heroSel || UI.targeting || UI.dragging) {
    ctx.save(); ctx.globalAlpha = 0.22 + 0.1 * Math.sin(time * 5);
    for (const p of g.level.paths) strokePath(ctx, pathPts(p), 1.6, UI.targeting ? "#ffd27a" : "#9cc8ff");
    ctx.restore();
  }
  g.level.slots.forEach((s, i) => { if (!g.towers[i]) drawSlot(ctx, s[0], 18 - s[1], UI.radialSlot === i); });
  // range preview
  if (UI.radialSlot != null) {
    const s = g.level.slots[UI.radialSlot], t = g.towers[UI.radialSlot];
    let st = null;
    if (t) st = UI.armed === "up" ? t.def.stats[String(t.level + 1)] : UI.armed === "A" || UI.armed === "B" ? t.def.stats[UI.armed] : g.stats(t);
    else if (UI.armed && UI.armed.startsWith("b:")) st = TOWERS[UI.armed.slice(2)].stats["1"];
    if (st) { ellipse(ctx, s[0], 18 - s[1], st.range, st.range, "rgba(255,241,208,0.10)", "rgba(255,241,208,0.6)", 0.06); }
  }
  // units sorted back to front
  const list = [];
  for (const t of g.towers) if (t) list.push([t.y, 0, t]);
  for (const e of g.enemies) list.push([e.y, 1, e]);
  for (const b of g.barricades) list.push([b.y, 2, b]);
  if (!g.hero.dead) list.push([g.hero.y, 3, g.hero]);
  list.sort((a, b) => b[0] - a[0]);
  for (const [, kind, o] of list) {
    if (kind === 0) drawTower(ctx, o.x, 18 - o.y, o, time);
    else if (kind === 1) drawEnemy(ctx, o, time);
    else if (kind === 2) drawBarricade(ctx, o);
    else drawHero(ctx, o, time, UI.heroSel);
  }
  if (g.hero.dead) drawHeroGhost(ctx, g.hero, time);
  if (UI.heroSel && g.hero.moving) ellipse(ctx, g.hero.tx, 18 - g.hero.ty, 0.35, 0.18, null, ART.gold, 0.06);
  for (const p of g.projectiles) drawProjectile(ctx, p);
  for (const f of g.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.k === "ring") {
      const r = f.r * (f.filled ? 0.35 + 0.65 * (1 - a) : 1 - a * 0.5);
      ctx.save(); ctx.globalAlpha = a * (REDUCED ? 0.5 : 0.85);
      if (f.filled) ellipse(ctx, f.x, 18 - f.y, r, r * 0.75, f.color + "55");
      ellipse(ctx, f.x, 18 - f.y, r, r * 0.75, null, f.color, 0.09);
      ctx.restore();
    } else { ctx.save(); ctx.globalAlpha = a; ellipse(ctx, f.x, 18 - f.y, f.size, f.size, f.color); ctx.restore(); }
  }
  // drag ghost
  if (UI.dragging && UI.dragPos) { ctx.save(); ctx.globalAlpha = 0.5; drawHero(ctx, { x: UI.dragPos[0], y: UI.dragPos[1], hp: g.hero.hp, face: 1, swing: 0 }, time, false); ctx.restore(); }
  // texts in screen space
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const t of g.texts) {
    const [sx, sy] = toScreen(t.x, t.y), a = clamp(t.life / t.max * 1.6, 0, 1);
    ctx.globalAlpha = a; ctx.font = "800 " + Math.round(clamp(view.S * 0.6, 11, 18)) + "px system-ui, sans-serif";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(42,34,51,0.9)"; ctx.strokeText(t.str, sx + shx, sy + shy); ctx.fillStyle = t.color; ctx.fillText(t.str, sx + shx, sy + shy);
  }
  ctx.globalAlpha = 1;
  if (UI.flash > 0) { ctx.fillStyle = `rgba(224,72,72,${UI.flash * 0.4})`; ctx.fillRect(0, 0, view.W, view.H); }
}

// ------------------------------------------------------------------ input (pointer events: no click delay on the canvas)
const ptr = { id: null, x: 0, y: 0, moved: false, onHero: false };
function heroScreenHit(sx, sy) {
  const h = G && G.hero; if (!h || h.dead) return false;
  const [hx, hy] = toScreen(h.x, h.y + 0.5);
  return Math.hypot(sx - hx, sy - hy) <= Math.max(30, view.S * 0.9);
}
function canvasPoint(ev) { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
cv.addEventListener("pointerdown", (ev) => {
  Sfx.init();
  if (ptr.id !== null) return;
  const [x, y] = canvasPoint(ev);
  ptr.id = ev.pointerId; ptr.x = x; ptr.y = y; ptr.moved = false;
  ptr.onHero = UI.screen === "play" && heroScreenHit(x, y);
  try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  ev.preventDefault();
});
cv.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== ptr.id) return;
  const [x, y] = canvasPoint(ev);
  if (Math.hypot(x - ptr.x, y - ptr.y) > 12) ptr.moved = true;
  if (ptr.onHero && ptr.moved && G) { UI.dragging = true; UI.dragPos = toWorld(x, y); UI.closeRadial(); }
});
const endPtr = (ev, cancel) => {
  if (ev.pointerId !== ptr.id) return;
  ptr.id = null;
  const [x, y] = canvasPoint(ev);
  if (UI.dragging) {
    UI.dragging = false;
    if (!cancel) heroOrder(...toWorld(x, y), true);
    return;
  }
  if (!cancel && !ptr.moved) tap(x, y);
};
cv.addEventListener("pointerup", (ev) => endPtr(ev, false));
cv.addEventListener("pointercancel", (ev) => endPtr(ev, true));
function heroOrder(wx, wy, fromDrag) {
  const hit = projectOntoPaths(G.paths, wx, wy, PATH_TOLERANCE);
  if (!hit) { UI.toast(fromDrag ? "Drop your hero on the road" : "Tap the road to move your hero"); return false; }
  if (G.heroMove(hit.x, hit.y)) { UI.heroSel = false; tutComplete("MoveHero"); Sfx.click(); }
  return true;
}
function tap(sx, sy) {
  if (UI.screen !== "play" || !G || G.over) return;
  const g = G, [wx, wy] = toWorld(sx, sy);
  if (UI.targeting) {
    const hit = projectOntoPaths(g.paths, wx, wy, PATH_TOLERANCE);
    if (hit) { if (g.castBarricade(hit.x, hit.y)) Sfx.build(); UI.targeting = false; } else UI.toast("Drop the barricade on the road");
    return;
  }
  if (heroScreenHit(sx, sy)) { UI.closeRadial(); UI.heroSel = !UI.heroSel; if (UI.heroSel) UI.toast("Tap the road to send your hero"); Sfx.click(); return; }
  const slot = g.level.slots.findIndex((s) => Math.abs(s[0] - wx) <= 0.8 && Math.abs(s[1] + 0.1 - wy) <= 0.75);
  if (slot >= 0) {
    if (UI.radialSlot === slot) UI.closeRadial(); else { UI.openRadial(slot); Sfx.click(); }
    return;
  }
  if (UI.radialSlot != null) { UI.closeRadial(); return; }
  if (UI.heroSel) heroOrder(wx, wy, false);
}

// ------------------------------------------------------------------ buttons
const onClick = (id, f) => $(id).addEventListener("click", (ev) => { Sfx.init(); f(ev); });
onClick("bPlay", () => { Sfx.click(); UI.showLevels(); });
onClick("bSound", () => { Sfx.setMuted(!Save.d.muted); Sfx.click(); UI.showMenu(); });
onClick("bBack", () => { Sfx.click(); UI.showMenu(); });
onClick("pause", () => { Sfx.click(); UI.pause(true); });
onClick("pzResume", () => { Sfx.click(); UI.pause(false); });
const askConfirm = (q, yes) => { $("pzAsk").textContent = q; $("pzConfirm").hidden = false; $("pzYes").onclick = () => { Sfx.click(); yes(); }; };
onClick("pzRestart", () => askConfirm("Restart this level?", () => { const g = G; if (g.wavesToWin === 0 && g.wave > 0) Save.record(g.level.id, g.mode, 0, endlessWaves()); startLevel(g.level.id, g.mode); }));
onClick("pzQuit", () => askConfirm("Leave this battle?", () => quitToMenu()));
onClick("pzNo", () => { $("pzConfirm").hidden = true; });
onClick("spd", () => { if (!G) return; G.speed = G.speed >= 3 ? 1 : G.speed + 1; Save.d.speed = G.speed; Save.store(); Sfx.click(); });
onClick("mute", () => { Sfx.setMuted(!Save.d.muted); });
onClick("wavebtn", () => { if (!G) return; const b = G.callEarly(); if (b >= 0) { tutComplete("CallWave"); Sfx.click(); } });
onClick("heroBtn", () => { if (!G || G.hero.dead) return; UI.closeRadial(); UI.targeting = false; UI.heroSel = !UI.heroSel; if (UI.heroSel) UI.toast("Tap the road to send your hero"); });
onClick("abilBtn", () => { if (G && !G.over && !G.heroAbility()) UI.toast(G.hero.dead ? "Your hero is recovering" : "Shockwave is recharging"); });
onClick("barBtn", () => {
  if (!G || G.over) return;
  if (G.barCd > 0) { UI.toast("Barricade ready in " + Math.ceil(G.barCd) + "s"); return; }
  UI.closeRadial(); UI.heroSel = false; UI.targeting = !UI.targeting;
  if (UI.targeting) UI.toast("Tap the road to drop a barricade");
});
onClick("tutSkip", () => { Tut.active = false; Save.d.tut = true; Save.store(); UI.renderTut(); });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("visibilitychange", () => { if (document.hidden && G && UI.screen === "play" && !G.over) UI.pause(true); });
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 150));

// ------------------------------------------------------------------ main loop
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1); // delta clamped: a background tab never fast-forwards the battle
  last = now;
  if (G && UI.screen === "play" && !G.paused) {
    let sim = dt * G.speed;
    const n = Math.max(1, Math.ceil(sim / 0.02)), h = sim / n;
    for (let i = 0; i < n; i++) G.step(h);
  } else if (G && G.over) G.updateFx(dt);
  if (UI.bannerT > 0) { UI.bannerT -= dt; if (UI.bannerT <= 0) $("banner").hidden = true; }
  if (UI.toastT > 0) { UI.toastT -= dt; if (UI.toastT <= 0) $("toast").hidden = true; }
  if (UI.flash > 0) UI.flash = Math.max(0, UI.flash - dt);
  if (G && UI.screen !== "menu") UI.hud();
  if (G && UI.radialSlot != null && UI.screen === "play") {
    const t = G.towers[UI.radialSlot];
    const sig = (t ? t.level + (t.branch || "") + t.prio : "-") + "|" + G.gold;
    if (UI.radialSig !== sig) { UI.radialSig = sig; UI.renderInfo(); }
  }
  render(now);
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ test hook (read-mostly; harmless in play)
window.__td = {
  selfCheck,
  state: () => G ? { screen: UI.screen, level: G.level.id, mode: G.mode, gold: G.gold, lives: G.lives, startLives: G.startLives, wave: G.wave,
    wavesToWin: G.wavesToWin, waveState: G.state, enemies: G.enemies.length, kills: G.kills, leaked: G.leaked, speed: G.speed, paused: !!G.paused,
    towers: G.towers.map((t) => t && { id: t.id, level: t.level, branch: t.branch }), hero: { x: G.hero.x, y: G.hero.y, dead: G.hero.dead }, radial: UI.radialSlot, armed: UI.armed }
    : { screen: UI.screen },
  save: () => JSON.parse(JSON.stringify(Save.d)),
  // client (viewport) coordinates for taps
  slot: (i) => { const r = cv.getBoundingClientRect(), s = G.level.slots[i], [x, y] = toScreen(s[0], s[1]); return { x: r.left + x, y: r.top + y }; },
  hero: () => { const r = cv.getBoundingClientRect(), [x, y] = toScreen(G.hero.x, G.hero.y + 0.5); return { x: r.left + x, y: r.top + y }; },
  world: (wx, wy) => { const r = cv.getBoundingClientRect(), [x, y] = toScreen(wx, wy); return { x: r.left + x, y: r.top + y }; },
  addGold: (n) => { if (G) G.gold += n | 0; },
  win: () => { if (G && !G.over) { G.wave = Math.max(G.wave, G.wavesToWin); G.win(); } },
};

Save.load();
resize();
paintSkillIcons();
UI.showMenu();
requestAnimationFrame(frame);

</script>
