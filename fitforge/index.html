<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FitForge</title>
    <meta name="description" content="WOD generator, lift library, cardio training, and yoga flows." />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#14171C" />

    <!-- iOS home-screen support: iOS ignores much of the manifest, so these
         apple-specific tags are what actually make it launch full-screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitForge" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />

    <style>
      html, body, #root { height: 100%; margin: 0; background: #14171C; }
      /* Respect the notch/home indicator when running standalone. */
      #root { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch(() => {
            /* Registration fails on http:// and in private mode; the app still runs. */
          });
        });
      }
    </script>
  </body>
</html>
