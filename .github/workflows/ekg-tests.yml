name: EKG trainer tests

on:
  pull_request:
    paths-ignore:
      - "betting-desk/**"
  push:
    branches: [main]
    paths-ignore:
      - "betting-desk/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekg-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (desktop + 375px mobile)
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
