<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betting Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23C9A227%22/%3E%3C/svg%3E">
<style>
  :root{
    --felt:#0F1512; --felt-2:#161E19; --felt-3:#1D2721; --rule:#26332C;
    --chalk:#E9E7DE; --dim:#87907F; --brass:#C9A227; --brass-soft:#8A731C;
    --up:#63C97F; --down:#DE5C48;
    --ticket:#F1EADA; --ink:#1A1713; --trule:#CFC4AC;
    --display:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--felt);color:var(--chalk);font-family:var(--body);
       font-size:15px;line-height:1.4;padding-bottom:96px;font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  header{padding:14px 16px 0}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:.02em;white-space:nowrap}
  @media (max-width:420px){h1{font-size:23px}}
  h1 span{color:var(--brass)}
  .stamp{font-size:11px;color:var(--dim);text-align:right;line-height:1.35}
  .controls{display:flex;gap:8px;margin:12px 0 0;align-items:center;flex-wrap:wrap}
  .refresh{flex:1;min-width:150px;background:var(--brass);border:0;color:#14110A;
    font-weight:700;font-size:15px;padding:12px;border-radius:3px;cursor:pointer}
  .refresh:disabled{opacity:.55;cursor:wait}
  .mini{background:var(--felt-2);border:1px solid var(--rule);color:var(--chalk);
    font-size:13px;padding:10px 11px;border-radius:3px}
  .mini[type=number]{width:74px}

  .rail{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .rail::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .sport{flex:0 0 auto;background:var(--felt-2);border:1px solid var(--rule);color:var(--dim);
    font-family:var(--display);font-weight:700;font-size:17px;padding:8px 15px 7px;
    border-radius:2px;cursor:pointer;letter-spacing:.03em}
  .sport[aria-selected=true]{background:var(--brass);border-color:var(--brass);color:#14110A}
  .tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--rule);overflow-x:auto}
  .tab{background:none;border:0;padding:0 0 10px;color:var(--dim);font-size:14px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab[aria-selected=true]{color:var(--chalk);border-bottom-color:var(--brass)}

  main{padding:14px 12px 0}
  .banner{border:1px solid var(--rule);border-left:3px solid var(--brass-soft);background:var(--felt-2);
    border-radius:3px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5}
  .banner.err{border-left-color:var(--down)}
  .banner b{display:block;margin-bottom:3px}
  .banner span{color:var(--dim)}

  .sechead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
  .sechead h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0}
  .sechead span{font-size:11.5px;color:var(--dim)}

  .game{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;margin-bottom:9px;overflow:hidden}
  .cell{background:var(--felt-3);border:1px solid var(--rule);border-radius:3px;color:var(--chalk);
    font-size:13px;padding:7px 2px;cursor:pointer;text-align:center;line-height:1.2;
    display:flex;flex-direction:column;justify-content:center;min-height:48px}
  .cell .p{color:#9FB3F5}
  .cell .bk{font-size:9.5px;color:var(--dim);margin-top:1px}
  .cell.on{background:var(--brass);border-color:var(--brass);color:#14110A}
  .cell.on .p,.cell.on .bk{color:#4A3C0C}
  .cell.plus{border-color:var(--up)}
  .cell.none{opacity:.45;cursor:default;font-size:15px}
  .gfoot{padding:7px 11px;border-top:1px dashed var(--rule);display:flex;gap:13px;flex-wrap:wrap;
    font-size:11px;color:var(--dim)}
  .gfoot b{color:var(--chalk);font-weight:600}
  .gtime{padding:7px 11px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--dim);
    display:flex;justify-content:space-between}

  .play{background:var(--felt-2);border:1px solid var(--rule);border-left:3px solid var(--up);
    border-radius:3px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
  .play .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .play .pick{font-size:14.5px;font-weight:600}
  .play .ev{font-family:var(--display);font-weight:700;font-size:20px;color:var(--up)}
  .play .l2{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}

  .empty{border:1px dashed var(--rule);border-radius:4px;padding:26px 20px;text-align:center;
    color:var(--dim);font-size:13.5px}
  .empty strong{display:block;color:var(--chalk);font-size:15px;margin-bottom:6px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ticket);color:var(--ink);
    border-top:3px solid var(--brass);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
  .bar .price{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
  .bar .sub{font-size:11.5px;opacity:.7}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ticket);color:var(--ink);
    max-height:84vh;overflow-y:auto;border-top:3px solid var(--brass);
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);
    visibility:hidden;transition:transform .22s,visibility 0s .22s}
  .sheet.open{transform:translateY(0);visibility:visible;transition:transform .22s}
  .scrim{position:fixed;inset:0;background:rgba(8,12,10,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.open{opacity:1;pointer-events:auto}
  .shead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--trule);
    padding-bottom:10px;margin-bottom:12px}
  .shead h2{font-family:var(--display);font-size:22px;margin:0}
  .x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink);padding:4px 8px}
  .leg{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--trule)}
  .leg .pk{font-weight:600;font-size:14px}
  .leg .mt{font-size:11.5px;opacity:.65;margin-top:2px}
  .leg .od{font-family:var(--display);font-weight:700;font-size:18px}
  .leg button{background:none;border:0;color:var(--down);font-size:12px;cursor:pointer;padding:2px 0 0}
  .srow{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
  .srow input{width:92px;padding:8px 10px;font-size:16px;border:1px solid var(--trule);
    border-radius:2px;background:#FBF7EC;color:var(--ink)}
  .tot{border-top:1px solid var(--trule);margin-top:12px;padding-top:12px}
  .trow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
  .trow.big{font-family:var(--display);font-weight:700;font-size:20px;padding-top:8px}
  .warn{margin-top:14px;padding:10px 12px;background:#E6DCC4;border-left:3px solid var(--brass-soft);
    font-size:12px;line-height:1.45}
  .clr{margin-top:12px;width:100%;padding:11px;background:none;border:1px solid var(--trule);
    border-radius:2px;font-size:13px;cursor:pointer;color:var(--ink)}
  .note{padding:6px 16px 26px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #14110A;border-top-color:transparent;
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---- header status ---- */
  .credits{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;
    border-radius:10px;border:1px solid var(--rule);color:var(--chalk);background:var(--felt-2);margin-bottom:3px}
  .credits.ok{border-color:var(--up);color:var(--up)}
  .credits.low{border-color:var(--brass);color:var(--brass)}
  .credits.out{border-color:var(--down);color:var(--down)}

  /* ---- filters ---- */
  .filters{display:flex;gap:8px;padding:10px 16px 0;flex-wrap:wrap;align-items:center}
  .filters label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim);
    letter-spacing:.05em;text-transform:uppercase;flex:1 1 120px;max-width:190px}
  .filters select,.filters input{background:var(--felt-2);border:1px solid var(--rule);color:var(--chalk);
    font-size:13px;padding:8px 9px;border-radius:3px;width:100%;font-family:inherit}
  .filters[hidden]{display:none}

  /* ---- generic game card ---- */
  .gtitle{display:flex;justify-content:space-between;gap:10px;padding:10px 11px 4px;align-items:baseline}
  .gtitle b{font-size:14px}
  .gtitle span{font-size:11px;color:var(--dim);white-space:nowrap}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;
    border-radius:2px;margin-left:6px;vertical-align:1px}
  .badge.live{background:var(--down);color:#fff}
  .badge.final{background:var(--rule);color:var(--chalk)}
  .badge.best{background:var(--brass);color:#14110A}
  .mkt{padding:4px 11px 8px}
  .mkt h3{font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin:4px 0 5px;font-weight:600;
    text-transform:uppercase;display:flex;justify-content:space-between}
  .mkt h3 i{font-style:normal;text-transform:none;letter-spacing:0}
  .sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px}
  .cell{position:relative;text-align:left;align-items:stretch;padding:7px 0;cursor:default;min-width:0}
  .cell .pk{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
    padding:0 26px 0 8px;width:100%}
  .cell .lb{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .cell .row{display:flex;gap:6px;align-items:baseline;margin-top:2px}
  .cell .p{font-family:var(--display);font-weight:700;font-size:17px}
  .cell .evp{font-size:11px;margin-left:auto;color:var(--dim)}
  .cell .evp.pos{color:var(--up)}
  .cell .bk{display:block}
  .cell.best{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
  .cell.on .evp,.cell.on .lb{color:#14110A}
  .trk{position:absolute;top:4px;right:3px;background:none;border:0;color:var(--dim);font-size:15px;
    cursor:pointer;padding:2px 5px;line-height:1}
  .trk.on{color:var(--brass)}
  .cell.on .trk{color:#4A3C0C}

  .play{position:relative}
  .play .ev.neg{color:var(--down)}
  .play.best{border-left-color:var(--brass);border-color:var(--brass);background:var(--felt-3)}
  .play .acts{display:flex;gap:8px;margin-top:8px}
  .btn{background:var(--felt-3);border:1px solid var(--rule);color:var(--chalk);font-size:12px;
    padding:6px 10px;border-radius:3px;cursor:pointer;font-family:inherit}
  .btn.on{border-color:var(--brass);color:var(--brass)}
  .btn.danger{color:var(--down)}

  /* ---- loading skeleton ---- */
  .skel{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;height:132px;margin-bottom:9px;
    background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
    background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .banner.caution{border-left-color:var(--brass)}
  .banner .retry{margin-top:8px}
  .banner ul{margin:4px 0 0;padding-left:18px;color:var(--dim)}

  /* ---- tracker ---- */
  .sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
  .stat b{display:block;font-family:var(--display);font-size:22px}
  .stat span{font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .tk{background:var(--felt-2);border:1px solid var(--rule);border-radius:3px;padding:11px 12px;margin-bottom:8px}
  .tk .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .tk .l2{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.55}
  .tk .clv{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}

  @media (min-width:900px){
    main,.filters,header{max-width:1180px;margin-left:auto;margin-right:auto}
    .gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
    .gamegrid .game{margin-bottom:0}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Betting <span>Desk</span></h1>
    <div class="stamp"><span class="credits" id="credits" title="The Odds API credits remaining">credits …</span><br>
      <span id="stamp">Not refreshed yet</span></div>
  </div>
  <div class="controls">
    <button class="refresh" id="go">Refresh board</button>
    <label class="mini">$<input class="mini" id="stake" type="number" value="10" min="1" step="1"
      aria-label="Stake in dollars" style="border:0;padding:0 0 0 4px;background:none"></label>
    <select class="mini" id="method" aria-label="De-vig method">
      <option value="power">Power de-vig</option>
      <option value="multiplicative">Multiplicative</option>
      <option value="additive">Additive</option>
    </select>
  </div>
</header>

<div class="rail" id="rail" role="tablist" aria-label="League"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="filters" id="filters">
  <label>Book<select id="f-book"></select></label>
  <label>Market<select id="f-market"></select></label>
  <label>Min edge %<input id="f-edge" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
  <label>Sort<select id="f-sort"></select></label>
</div>
<main id="out"></main>
<p class="note" id="note"></p>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Parlay slip">
  <div class="shead"><h2>Parlay slip</h2><button class="x" id="close" aria-label="Close">&times;</button></div>
  <div id="legs"></div>
  <div class="srow"><label for="pstake">Stake $</label>
    <input id="pstake" type="number" value="10" min="0" step="1"></div>
  <div class="tot" id="tot"></div><div class="warn" id="warn"></div>
  <button class="clr" id="clear">Clear all legs</button>
</section>
<div class="bar" id="bar">
  <div><div id="barlegs">No legs yet</div><div class="sub" id="barsub">Tap any price to add a leg</div></div>
  <div class="price" id="barprice">—</div>
</div>

<script>
/* Research only. Nothing on this page talks to a sportsbook account. */
const LEAGUES=[["mlb","MLB"],["nfl","NFL"],["ncaaf","CFB"],["nba","NBA"],
  ["nhl","NHL"],["ncaab","CBB"],["wnba","WNBA"],["epl","EPL"],["mls","MLS"]];
const TABS=["Board","Plays","Tracked","Injuries"];
const MARKET_NAMES={h2h:"Moneyline",spreads:"Spread",totals:"Total"};
const TRACK_KEY="bd.tracked.v1", PREF_KEY="bd.prefs.v1";

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const prefs=Object.assign({league:"mlb",tab:"Board",book:"best",market:"all",edge:0,sort:""},
  store.get(PREF_KEY,{}));
let league=prefs.league,tab=TABS.includes(prefs.tab)?prefs.tab:"Board";
let data=null,inj=null,slip=[],busy=false,loadErr=null,usage=null;
let tracked=store.get(TRACK_KEY,[]); if(!Array.isArray(tracked))tracked=[];
let REG={};   // render-time registry of priced sides, keyed for the slip/track buttons

const $=id=>document.getElementById(id);
const out=$("out"),rail=$("rail"),tabsEl=$("tabs");
const money=n=>n==null||isNaN(n)?"—":(n<0?"-$":"$")+Math.abs(n).toFixed(2);
const am=n=>n==null||isNaN(n)?"—":(n>0?"+":"")+n;
const pct=(n,d=1)=>n==null||isNaN(n)?"—":(n*100).toFixed(d)+"%";
const spct=(n,d=1)=>n==null||isNaN(n)?"—":(n>0?"+":"")+(n*100).toFixed(d)+"%";
const dec=a=>a>0?1+a/100:1+100/(-a);
const h=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const mname=k=>MARKET_NAMES[k]||String(k).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const savePrefs=()=>store.set(PREF_KEY,{league,tab,book:prefs.book,market:prefs.market,edge:prefs.edge,sort:prefs.sort});
const saveTracked=()=>store.set(TRACK_KEY,tracked);

/* ---------------- chrome ---------------- */
LEAGUES.forEach(([k,l])=>{const b=document.createElement("button");
  b.className="sport";b.textContent=l;b.setAttribute("role","tab");
  b.onclick=()=>{if(league===k)return;league=k;data=null;inj=null;loadErr=null;savePrefs();render();refresh();};
  rail.appendChild(b);});
TABS.forEach(t=>{const b=document.createElement("button");b.className="tab";b.textContent=t;
  b.setAttribute("role","tab");
  b.onclick=()=>{tab=t;savePrefs();render();if(t==="Injuries"&&!inj)loadInjuries();};tabsEl.appendChild(b);});

$("go").onclick=refresh;
$("stake").onchange=()=>{if(data)refresh();};
$("method").onchange=()=>{if(data)refresh();};
$("f-book").onchange=e=>{prefs.book=e.target.value;savePrefs();render();};
$("f-market").onchange=e=>{prefs.market=e.target.value;savePrefs();render();};
$("f-edge").oninput=e=>{prefs.edge=Math.max(0,+e.target.value||0);savePrefs();render();};
$("f-sort").onchange=e=>{prefs.sort=e.target.value;savePrefs();render();};
$("f-edge").value=prefs.edge;

/* ---------------- data ---------------- */
async function refresh(){
  if(busy)return; busy=true; loadErr=null;
  const btn=$("go"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Pulling live data…';
  render();
  const want=league;
  try{
    const stake=$("stake").value||10, method=$("method").value;
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),45000);
    let r;
    try{r=await fetch(`/api/board/${want}?stake=${encodeURIComponent(stake)}&method=${method}`,{signal:ctl.signal});}
    finally{clearTimeout(timer);}
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok||!j) throw new Error((j&&j.detail)||`Server answered HTTP ${r.status}`);
    if(want!==league)return;               // user switched league mid-flight
    data=normalise(j);
    if(data.usage)setUsage(data.usage);
    updateTracked(data);
  }catch(e){
    if(want!==league)return;
    loadErr=e.name==="AbortError"?"The server took too long to answer (45s).":String(e.message||e);
  }finally{
    busy=false; btn.disabled=false; btn.textContent="Refresh board";
    render();
  }
}

// Coerce the payload into the shape the renderer relies on, whatever the backend sends.
function normalise(j){
  j.games=Array.isArray(j.games)?j.games:[];
  j.plays=Array.isArray(j.plays)?j.plays:[];
  j.errors=Array.isArray(j.errors)?j.errors:[];
  j.warnings=Array.isArray(j.warnings)?j.warnings:[];
  j.your_books=Array.isArray(j.your_books)?j.your_books:[];
  j.summary=j.summary||{};
  j.games.forEach(g=>{g.markets=g.markets&&typeof g.markets==="object"?g.markets:{};
    g.home=g.home||{};g.away=g.away||{};});
  return j;
}

async function loadUsage(){
  try{const r=await fetch("/api/usage");setUsage(await r.json());}catch(e){setUsage(null);}
}
function setUsage(u){usage=u;renderCredits();}
function renderCredits(){
  const el=$("credits"),u=usage||{};
  el.className="credits";
  if(u.demo){el.textContent="DEMO · no credits spent";el.title="Demo mode reads frozen fixtures.";return;}
  if(u.error){el.textContent="no API key";el.classList.add("out");el.title=u.error;return;}
  const n=u.credits_remaining;
  if(n==null){el.textContent="credits: refresh to see";return;}
  el.textContent=`${n} credits left`;
  el.classList.add(n<=0?"out":n<50?"low":"ok");
  el.title=`Used ${u.credits_used??"?"} · last call cost ${u.last_call_cost??"?"}`;
}

async function loadInjuries(){
  const want=league;
  try{const r=await fetch(`/api/injuries/${want}`);inj=await r.json();if(!r.ok)throw new Error(inj.detail||r.status);}
  catch(e){inj={injuries:[],error:String(e.message||e)};}
  if(want===league)render();
}

/* ---------------- filters ---------------- */
function marketKeys(){
  const s=new Set();
  if(data){data.games.forEach(g=>Object.keys(g.markets).forEach(k=>s.add(k)));data.plays.forEach(p=>p.market&&s.add(p.market));}
  return [...s];
}
function fillSelect(el,opts,val){
  const html=opts.map(([v,l])=>`<option value="${h(v)}">${h(l)}</option>`).join("");
  if(el.dataset.sig!==html){el.innerHTML=html;el.dataset.sig=html;}
  el.value=opts.some(o=>o[0]===val)?val:opts[0][0];
  return el.value;
}
function syncFilters(){
  const show=data&&!data.error&&(tab==="Board"||tab==="Plays");
  $("filters").hidden=!show;
  if(!show)return;
  const books=data.your_books.length?data.your_books:[...new Set(data.plays.map(p=>p.book))];
  prefs.book=fillSelect($("f-book"),[["best","Best of my books"],...books.map(b=>[b,b])],prefs.book);
  prefs.market=fillSelect($("f-market"),[["all","All markets"],...marketKeys().map(k=>[k,mname(k)])],prefs.market);
  const sorts=tab==="Plays"
    ?[["ev","EV % (high first)"],["evd","EV $ (high first)"],["kelly","Kelly (high first)"],["time","Start time"],["book","Book"]]
    :[["time","Start time"],["edge","Best edge first"]];
  const sel=fillSelect($("f-sort"),sorts,prefs.sort);
  prefs.sort=sel;
}
const minEdge=()=>(+prefs.edge||0)/100;
const marketOk=k=>prefs.market==="all"||prefs.market===k;
function filteredPlays(){
  return data.plays.filter(p=>marketOk(p.market)&&(prefs.book==="best"||p.book===prefs.book)
    &&typeof p.ev_per_dollar==="number"&&p.ev_per_dollar>=minEdge()&&p.ev_per_dollar>0);
}
// Highest-EV play passing the filters. With no +EV play and no min edge set,
// fall back to the price closest to fair so the board still says where to look.
function bestPlay(){
  const top=filteredPlays().slice().sort((a,b)=>b.ev_per_dollar-a.ev_per_dollar)[0];
  if(top||minEdge()>0)return top||null;
  let best=null;
  data.games.forEach(g=>Object.entries(g.markets).forEach(([k,m])=>{
    if(!marketOk(k)||!m||!Array.isArray(m.sides))return;
    m.sides.forEach(s=>{const y=pickBook(s);
      if(y&&typeof y.ev_per_dollar==="number"&&(!best||y.ev_per_dollar>best.ev_per_dollar))
        best={game:g.name,espn_id:g.espn_id,start_utc:g.start_utc,market:k,side:s.label,point:s.point??null,
          book:y.book,price:y.price,fair_price:s.fair_price,fair_prob:s.fair_prob,fair_source:m.fair_source,
          ev_per_dollar:y.ev_per_dollar,ev_dollars:y.ev_dollars,kelly:y.kelly,
          quarter_kelly:y.kelly!=null?y.kelly/4:null,book_count:m.book_count};});
  }));
  return best;
}
const playKey=p=>[league,p.game,p.market,p.side,p.point??"",p.book].join("|");

/* ---------------- render ---------------- */
function render(){
  [...rail.children].forEach((b,i)=>b.setAttribute("aria-selected",LEAGUES[i][0]===league));
  [...tabsEl.children].forEach((b,i)=>{b.setAttribute("aria-selected",TABS[i]===tab);
    if(TABS[i]==="Tracked")b.textContent=`Tracked${tracked.length?` (${tracked.length})`:""}`;});
  if(data&&data.generated_at)
    $("stamp").textContent=`Refreshed ${new Date(data.generated_at).toLocaleTimeString()}`;
  renderCredits();
  syncFilters();
  REG={};
  if(tab==="Tracked")return renderTracked();
  if(tab==="Injuries")return renderInjuries();

  const top=statusBanners();
  if(!data){
    if(busy){out.innerHTML=top+`<div class="gamegrid">${'<div class="skel"></div>'.repeat(4)}</div>`;return;}
    out.innerHTML=top||`<div class="empty"><strong>Nothing loaded yet</strong>
      Pick a league and hit Refresh. Schedules come free from ESPN; odds cost credits.</div>`;
    wire();return;
  }
  out.innerHTML=top+(tab==="Plays"?playsHTML():boardHTML());
  wire();
}

function statusBanners(){
  let s="";
  if(busy&&data)s+=`<div class="banner"><b><span class="spin" style="border-color:var(--chalk);border-top-color:transparent"></span>Refreshing…</b>
    <span>Showing the previous board until the new one arrives.</span></div>`;
  if(loadErr)s+=`<div class="banner err" role="alert"><b>Refresh failed</b><span>${h(loadErr)}</span>
    ${data?`<span><br>Still showing the last good board from ${new Date(data.generated_at).toLocaleTimeString()}.</span>`:""}
    <div class="retry"><button class="btn" data-act="retry">Try again</button></div></div>`;
  if(!data)return s;
  if(data.demo_mode)s+=`<div class="banner"><b>Demo mode</b><span>Frozen fixtures from Sep 15 2026. No credits spent, nothing live.</span></div>`;
  const errs=data.errors;
  if(errs.length){
    const what={odds:"Odds feed",schedule:"ESPN schedule",board:"Board builder"};
    s+=`<div class="banner caution" role="status"><b>Partial board — ${errs.length} source${errs.length>1?"s":""} failed</b>
      <span>Everything that did load is shown below.</span><ul>${errs.map(e=>
      `<li><b style="display:inline;color:var(--chalk)">${h(what[e.source]||e.source)}</b> (${h(e.kind)}): ${h(e.message)}</li>`).join("")}</ul>
      ${errs.some(e=>e.kind==="rate_limit")?`<span>Rate limited: wait a minute before refreshing, or you'll burn calls for nothing.</span>`:""}</div>`;
  }
  if(data.stale_odds)s+=`<div class="banner caution"><b>Odds are from cache</b><span>The feed failed just now, so these are the last prices that loaded. Treat them as stale.</span></div>`;
  if(data.warnings.length)s+=`<div class="banner caution"><b>${data.warnings.length} market${data.warnings.length>1?"s":""} skipped</b>
    <span>${data.warnings.slice(0,5).map(h).join("<br>")}</span></div>`;
  return s;
}

function bestHTML(){
  const b=bestPlay();
  if(!b)return "";
  if(b.ev_per_dollar<=0)return `<div class="sechead"><h2>Closest to fair</h2><span>no price beats fair value</span></div>`+
    playCard(b,true,"Nothing on the board is +EV. This is the least-bad price your books show — a reference point, not a play.");
  return `<div class="sechead"><h2>Best play</h2><span>highest EV that passes your filters</span></div>`+playCard(b,true);
}

function boardHTML(){
  const gs=data.games;
  if(!gs.length)return `<div class="empty"><strong>No games on the board</strong>
    ${data.errors.length?"The sources above failed, so there is nothing to show yet.":
      "Neither ESPN nor the odds feed lists a game for "+h(league.toUpperCase())+" right now. Off-season or an off day."}</div>`;
  const withOdds=gs.filter(g=>g.has_odds), without=gs.filter(g=>!g.has_odds);
  const sm=data.summary;
  let html=`<div class="banner"><b>${sm.games_with_odds??withOdds.length} of ${sm.games_total??gs.length} games priced</b>
    <span>Fair value from ${data.sharp_book?"sharp book "+h(data.sharp_book):"a consensus of the books in the feed"},
    ${h(data.devig_method)} de-vig. Your books: ${h(data.your_books.join(", ")||"none set")}.
    ${sm.plays_found??data.plays.length} spot${(sm.plays_found??data.plays.length)===1?"":"s"} above fair value.</span></div>`;
  html+=bestHTML();
  const edgeOf=g=>Math.max(-9,...Object.entries(g.markets).filter(([k,m])=>marketOk(k)&&m&&Array.isArray(m.sides))
    .flatMap(([,m])=>m.sides.map(s=>(pickBook(s)||{}).ev_per_dollar??-9)));
  const sorted=withOdds.slice().sort(prefs.sort==="edge"?(a,b)=>edgeOf(b)-edgeOf(a)
    :(a,b)=>(Date.parse(a.start_utc)||0)-(Date.parse(b.start_utc)||0));
  const cards=sorted.map(gameCard).filter(Boolean);
  html+=`<div class="sechead"><h2>Board</h2><span>${prefs.book==="best"?"best of your books":h(prefs.book)}${prefs.market==="all"?"":" · "+h(mname(prefs.market))}</span></div>`;
  html+=cards.length?`<div class="gamegrid">${cards.join("")}</div>`
    :`<div class="empty"><strong>No ${h(mname(prefs.market))} prices</strong>No priced game carries that market. Try “All markets”.</div>`;
  if(without.length)html+=`<div class="sechead" style="padding-top:14px"><h2>No prices</h2>
    <span>${without.length} game${without.length===1?"":"s"}</span></div><div class="gamegrid">`+
    without.map(g=>`<div class="game"><div class="gtitle"><b>${h(g.name)}${stateBadge(g)}</b>
      <span>${fmtTime(g.start_utc)}</span></div>
      <div class="gfoot"><span>No book in the feed is quoting this game yet.</span></div></div>`).join("")+`</div>`;
  return html;
}

function stateBadge(g){
  if(g.state==="in")return `<span class="badge live">LIVE</span>`;
  if(g.state==="post")return `<span class="badge final">FINAL</span>`;
  return "";
}

// which of your books' prices to show for a side
function pickBook(s){
  const ys=Array.isArray(s.your_books)?s.your_books:[];
  if(prefs.book!=="best")return ys.find(y=>y.book===prefs.book)||null;
  return ys.reduce((a,y)=>!a||y.ev_per_dollar>a.ev_per_dollar?y:a,null);
}

function gameCard(g){
  const best=bestPlay();
  const mk=Object.entries(g.markets).filter(([k])=>marketOk(k));
  if(!mk.length)return "";
  const sections=mk.map(([k,m])=>{
    if(!m||!Array.isArray(m.sides)||!m.sides.length)
      return `<div class="mkt"><h3>${h(mname(k))}<i>not quoted</i></h3></div>`;
    return `<div class="mkt"><h3>${h(mname(k))}<i>${h(m.fair_source||"")}${m.book_count?` · ${m.book_count} books`:""}</i></h3>
      <div class="sides">${m.sides.map((s,i)=>sideCell(g,k,m,s,i,best)).join("")}</div></div>`;
  }).join("");
  const title=g.name||`${g.away.name||"Away"} at ${g.home.name||"Home"}`;
  return `<div class="game"><div class="gtitle"><b>${h(title)}${stateBadge(g)}</b><span>${fmtTime(g.start_utc)}</span></div>
    ${sections}
    ${g.venue||g.match_confidence!=null&&g.match_confidence<0.72?`<div class="gtime"><span>${h(g.venue||"")}</span>
      <span>${g.match_confidence===0?"odds feed only":""}</span></div>`:""}</div>`;
}

function fmtPoint(market,pt){
  if(pt==null)return "";
  return market==="spreads"&&pt>0?"+"+pt:String(pt);
}

function sideCell(g,market,m,s,i,best){
  const mine=pickBook(s);
  const label=`${s.label??["Side A","Side B"][i]??"Side"}${s.point!=null?" "+fmtPoint(market,s.point):""}`;
  if(!mine)return `<div class="cell none" title="Your book doesn't quote this side">
      <span class="pk"><span class="lb">${h(label)}</span><span class="row"><span class="p">—</span>
      <span class="evp">fair ${am(s.fair_price)}</span></span></span></div>`;
  const p={game:g.name||`${g.away.name} at ${g.home.name}`,espn_id:g.espn_id,start_utc:g.start_utc,
    market,side:s.label,point:s.point??null,book:mine.book,price:mine.price,fair_prob:s.fair_prob,
    fair_price:s.fair_price,ev_per_dollar:mine.ev_per_dollar,ev_dollars:mine.ev_dollars,
    fair_source:m.fair_source,label:`${label} (${mname(market)})`};
  const k=playKey(p); REG[k]=p;
  const isBest=best&&playKey(best)===k;
  const on=slip.some(l=>l.id===k)?" on":"";
  const edge=mine.ev_per_dollar;
  const plus=edge>0&&edge>=minEdge()?" plus":"";
  const tr=isTracked(k);
  return `<div class="cell${on}${plus}${isBest?" best":""}">
    <button class="pk" data-slip="${h(k)}" aria-label="Add ${h(label)} ${am(mine.price)} to slip">
      <span class="lb">${h(label)}${isBest?`<span class="badge best">${edge>0?"BEST":"CLOSEST"}</span>`:""}</span>
      <span class="row"><span class="p">${am(mine.price)}</span>
      <span class="evp${edge>0?" pos":""}">${spct(edge)}</span></span>
      <span class="bk">${h(mine.book)} · fair ${am(s.fair_price)}</span></button>
    <button class="trk${tr?" on":""}" data-track="${h(k)}" title="${tr?"Stop tracking":"Track this play"}"
      aria-label="${tr?"Stop tracking":"Track"} ${h(label)}">${tr?"★":"☆"}</button></div>`;
}

function playsHTML(){
  const ps=filteredPlays();
  const s=prefs.sort;
  const cmp={ev:(a,b)=>b.ev_per_dollar-a.ev_per_dollar,evd:(a,b)=>(b.ev_dollars||0)-(a.ev_dollars||0),
    kelly:(a,b)=>(b.kelly||0)-(a.kelly||0),time:(a,b)=>(Date.parse(a.start_utc)||0)-(Date.parse(b.start_utc)||0),
    book:(a,b)=>String(a.book).localeCompare(b.book)||b.ev_per_dollar-a.ev_per_dollar}[s]||((a,b)=>b.ev_per_dollar-a.ev_per_dollar);
  if(!ps.length){
    const any=data.plays.length;
    return `<div class="empty"><strong>${any?"No plays pass your filters":"No edge on the board right now"}</strong>
      ${any?`${any} price${any===1?"":"s"} sit above fair value, but none match the book, market and ${prefs.edge}% minimum you set.`
      :`Every price your books are showing sits at or below fair value after removing the vig.
      That is a normal result and a valid place to stop.`}</div>`;
  }
  const best=bestPlay();
  return `<div class="banner"><b>${ps.length} price${ps.length===1?"":"s"} above fair value${prefs.edge>0?` by ${prefs.edge}%+`:""}</b>
    <span>These are small and they are estimates — the fair number is only as good as the books behind it
    (${h(data.sharp_book||"soft-book consensus")}).</span></div>`+
    ps.slice().sort(cmp).map(p=>playCard(p,best&&playKey(best)===playKey(p))).join("");
}

function playCard(p,isBest,note){
  const k=playKey(p); REG[k]={...p,label:`${p.side}${p.point!=null?" "+fmtPoint(p.market,p.point):""} (${mname(p.market)})`};
  const tr=isTracked(k), on=slip.some(l=>l.id===k);
  return `<div class="play${isBest?" best":""}">
    <div class="l1"><div class="pick">${isBest?`<span class="badge best" style="margin:0 6px 0 0">${p.ev_per_dollar>0?"BEST":"CLOSEST"}</span>`:""}${h(p.side)}${p.point!=null?" "+h(fmtPoint(p.market,p.point)):""}
      · ${h(mname(p.market))} · ${h(p.book)} ${am(p.price)}</div>
    <div class="ev${p.ev_per_dollar<=0?" neg":""}">${spct(p.ev_per_dollar)}</div></div>
    <div class="l2">${h(p.game)} · ${fmtTime(p.start_utc)}<br>
    Fair ${am(p.fair_price)} (${pct(p.fair_prob)}) from ${h(p.fair_source)}${p.book_count?` · ${p.book_count} books`:""}<br>
    EV ${money(p.ev_dollars)} at ${money(data.stake)}${p.quarter_kelly!=null&&p.ev_per_dollar>0?` · quarter-Kelly ${pct(p.quarter_kelly,2)} of bankroll`:""}
    ${note?`<br><i>${h(note)}</i>`:""}</div>
    <div class="acts"><button class="btn${on?" on":""}" data-slip="${h(k)}">${on?"In slip ✓":"Add to slip"}</button>
      <button class="btn${tr?" on":""}" data-track="${h(k)}">${tr?"★ Tracking":"☆ Track"}</button></div></div>`;
}

function renderInjuries(){
  if(!inj){out.innerHTML=`<div class="skel" style="height:60px"></div>`.repeat(3);return;}
  const rows=Array.isArray(inj.injuries)?inj.injuries:[];
  if(inj.error&&!rows.length){out.innerHTML=`<div class="banner caution"><b>Injury report unavailable</b>
    <span>${h(inj.error)}</span><div class="retry"><button class="btn" data-act="inj">Try again</button></div></div>`;wire();return;}
  if(!rows.length){out.innerHTML=`<div class="empty"><strong>No injury rows returned</strong>
    ESPN's coverage varies by league. Empty here is not an error — it means ESPN
    isn't publishing a report for ${h(league.toUpperCase())} right now.</div>`;return;}
  const byTeam={};rows.forEach(r=>{(byTeam[r.team||"—"]=byTeam[r.team||"—"]||[]).push(r);});
  out.innerHTML=Object.entries(byTeam).map(([t,list])=>

      <span><b style="color:var(--chalk)">${h(r.player)}</b> ${h(r.position)}</span>
      <span>${h(r.status)}</span></div>
      ${r.detail?`<div class="gfoot"><span>${h(r.detail)}</span></div>`:""}</div>`).join("")).join("");
}

/* ---------------- tracking + CLV ----------------
   A tracked play is stored in localStorage with the price you saw. Each board
   refresh before the game starts records that book's current price as the
   latest pre-start snapshot. Once the game starts (ESPN state in/post, or the
   clock passes start time) the last pre-start snapshot becomes the closing line.
   The closing line is only as fresh as your last refresh before first pitch/kickoff. */
const isTracked=k=>tracked.some(t=>t.id===k);

function toggleTrack(k){
  const i=tracked.findIndex(t=>t.id===k);
  if(i>-1){tracked.splice(i,1);}
  else{
    const p=REG[k]; if(!p)return;
    const snap={price:p.price,point:p.point??null,fair_prob:p.fair_prob??null,at:data.generated_at};
    tracked.push({id:k,league,game:p.game,espn_id:p.espn_id??null,start_utc:p.start_utc,market:p.market,
      side:p.side,point:p.point??null,book:p.book,price:p.price,fair_prob:p.fair_prob??null,
      ev_per_dollar:p.ev_per_dollar??null,ev_dollars:p.ev_dollars??null,stake:+(data.stake||$("stake").value||10),
      demo:!!data.demo_mode,logged_at:new Date().toISOString(),last:snap,close:null,closed:false});
  }
  saveTracked();render();
}

function findSide(board,t){
  const g=board.games.find(g=>(t.espn_id&&g.espn_id===t.espn_id)||g.name===t.game);
  if(!g)return {g:null,snap:null};
  const m=g.markets[t.market];
  const s=m&&Array.isArray(m.sides)?m.sides.find(s=>s.label===t.side):null;
  const y=s&&Array.isArray(s.your_books)?s.your_books.find(y=>y.book===t.book):null;
  return {g,snap:y?{price:y.price,point:s.point??null,fair_prob:s.fair_prob??null,at:board.generated_at}:null};
}
function hasStarted(t,g){
  if(g&&g.state)return g.state==="in"||g.state==="post";
  if(t.demo)return false;
  const s=Date.parse(t.start_utc);
  return !isNaN(s)&&s<=Date.now();
}
function closeOut(t){t.closed=true;t.close=t.last||null;t.closed_at=new Date().toISOString();}

function updateTracked(board){
  let dirty=false;
  tracked.forEach(t=>{
    if(t.closed||t.league!==league)return;
    const {g,snap}=findSide(board,t);
    if(hasStarted(t,g)){closeOut(t);dirty=true;return;}
    if(snap){t.last=snap;dirty=true;}
  });
  if(dirty)saveTracked();
}
// no refresh needed for the clock to close a live-data play
function closeByClock(){
  let dirty=false;
  tracked.forEach(t=>{if(!t.closed&&hasStarted(t,null)){closeOut(t);dirty=true;}});
  if(dirty)saveTracked();
}

function clvOf(t){
  const c=t.closed?t.close:t.last;
  if(!c||c.price==null)return {c,moved:false,price:null,fair:null};
  const moved=(c.point??null)!==(t.point??null);
  if(moved)return {c,moved,price:null,fair:null};
  return {c,moved,price:dec(t.price)/dec(c.price)-1,
    fair:c.fair_prob!=null?c.fair_prob*dec(t.price)-1:null};
}

function renderTracked(){
  closeByClock();
  if(!tracked.length){out.innerHTML=`<div class="empty"><strong>No tracked plays</strong>
    Tap ☆ on any price on the Board or Plays tab to log it here. Refresh the board before the game
    starts and the last price you saw becomes the closing line, so you can see whether you beat it.
    Stored in this browser only.</div>`;return;}
  const rows=tracked.map(t=>({t,...clvOf(t)}));
  const closed=rows.filter(r=>r.t.closed);
  const scored=closed.filter(r=>r.fair!=null);
  const beat=closed.filter(r=>r.price!=null);
  const avg=scored.length?scored.reduce((a,r)=>a+r.fair,0)/scored.length:null;
  const entryEV=tracked.reduce((a,t)=>a+(t.ev_dollars||0),0);
  const cls=v=>v==null?"":v>0?"pos":v<0?"neg":"";
  let html=`<div class="sumgrid">
    <div class="stat"><b>${tracked.length}</b><span>tracked · ${tracked.length-closed.length} open</span></div>
    <div class="stat"><b class="${cls(avg)}">${spct(avg,2)}</b><span>avg CLV vs fair close</span></div>
    <div class="stat"><b>${beat.length?`${beat.filter(r=>r.price>0).length}/${beat.length}`:"—"}</b><span>beat closing price</span></div>
    <div class="stat"><b class="${cls(entryEV)}">${money(entryEV)}</b><span>EV at entry (sum)</span></div></div>
    <div class="banner"><b>How CLV is measured here</b><span>Closing line = the last price your book showed on a board
    refresh before the game started. <i>CLV vs fair</i> is your price against the de-vigged closing probability — positive
    means you got a better number than the market settled on. Research only; nothing is placed.</span></div>`;
  const sorted=rows.slice().sort((a,b)=>(a.t.closed-b.t.closed)||(Date.parse(a.t.start_utc)||0)-(Date.parse(b.t.start_utc)||0));
  html+=sorted.map(({t,c,moved,price,fair})=>{
    const status=t.closed?(c?"Closed":"Closed — no pre-start price captured"):"Open";
    const cur=c?`${t.closed?"Close":"Now"} ${am(c.price)}${c.point!=null?` @ ${fmtPoint(t.market,c.point)}`:""}${c.fair_prob!=null?` (fair ${pct(c.fair_prob)})`:""}`:"";
    return `<div class="tk"><div class="l1"><div><b>${h(t.side)}${t.point!=null?" "+h(fmtPoint(t.market,t.point)):""}</b>
      · ${h(mname(t.market))} · ${h(t.book)} ${am(t.price)}</div>
      <div class="clv ${cls(fair)}" title="CLV vs fair ${t.closed?"close":"(so far)"}">${moved?"line moved":spct(fair,2)}</div></div>
      <div class="l2">${h(t.game)} · ${h(String(t.league).toUpperCase())} · ${fmtTime(t.start_utc)}${t.demo?" · demo":""}<br>
      <b style="color:var(--chalk)">${status}</b>${cur?` · ${cur}`:""}${price!=null?` · price CLV ${spct(price,2)}`:""}
      ${moved?` · line moved from ${h(fmtPoint(t.market,t.point))} to ${h(fmtPoint(t.market,c.point))}, prices not comparable`:""}<br>
      Logged ${new Date(t.logged_at).toLocaleString()} · entry EV ${spct(t.ev_per_dollar,1)} (${money(t.ev_dollars)} on ${money(t.stake)})</div>
      <div class="acts" style="display:flex;gap:8px;margin-top:8px">
      ${t.closed?"":`<button class="btn" data-lock="${h(t.id)}" title="Use the latest price seen as the closing line now">Lock close now</button>`}
      <button class="btn danger" data-untrack="${h(t.id)}">Remove</button></div></div>`;
  }).join("");
  html+=`<div style="text-align:center;margin:14px 0"><button class="btn danger" data-act="clear-tracked">Clear all tracked plays</button></div>`;
  out.innerHTML=html; wire();
}

/* ---------------- wiring ---------------- */
function wire(){
  out.querySelectorAll("[data-slip]").forEach(el=>el.onclick=()=>toggleSlip(el.dataset.slip));
  out.querySelectorAll("[data-track]").forEach(el=>el.onclick=e=>{e.stopPropagation();toggleTrack(el.dataset.track);});
  out.querySelectorAll("[data-untrack]").forEach(el=>el.onclick=()=>{
    tracked=tracked.filter(t=>t.id!==el.dataset.untrack);saveTracked();render();});
  out.querySelectorAll("[data-lock]").forEach(el=>el.onclick=()=>{
    const t=tracked.find(t=>t.id===el.dataset.lock);if(t){closeOut(t);saveTracked();render();}});
  out.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==="retry")refresh();
    if(a==="inj"){inj=null;render();loadInjuries();}
    if(a==="clear-tracked"&&confirm("Remove every tracked play from this browser?")){tracked=[];saveTracked();render();}
  });
}

function toggleSlip(k){
  const i=slip.findIndex(l=>l.id===k);
  if(i>-1)slip.splice(i,1);
  else{const p=REG[k];if(!p)return;
    slip.push({id:k,label:p.label||p.side,american:+p.price,fair_prob:p.fair_prob??null,
      game:p.game,game_id:p.espn_id||p.game,time:p.start_utc});}
  render();priceSlip();
}

let slipSeq=0;
async function priceSlip(){
  const stake=+($("pstake").value||10), seq=++slipSeq;
  $("barlegs").textContent=slip.length?`${slip.length} leg${slip.length>1?"s":""}`:"No legs yet";
  if(!slip.length){
    $("barprice").textContent="—";$("barsub").textContent="Tap any price to add a leg";
    $("legs").innerHTML=`<p style="font-size:13px;opacity:.7">Empty.</p>`;
    $("tot").innerHTML="";$("warn").innerHTML="";return;
  }
  $("legs").innerHTML="";
  slip.forEach((l,i)=>{const d=document.createElement("div");d.className="leg";
    d.innerHTML=`<div><div class="pk">${h(l.label)}</div><div class="mt">${h(l.game)} · ${fmtTime(l.time)}</div>
      <button>Remove</button></div><div class="od">${am(l.american)}</div>`;
    d.querySelector("button").onclick=()=>{slip.splice(i,1);render();priceSlip();};
    $("legs").appendChild(d);});
  let j;
  try{
    const r=await fetch("/api/parlay",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({stake,legs:slip.map(l=>({label:l.label,american:l.american,
        fair_prob:l.fair_prob,game_id:l.game_id}))})});
    j=await r.json(); if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:`HTTP ${r.status}`);
  }catch(e){
    if(seq!==slipSeq)return;
    $("barprice").textContent="—";$("barsub").textContent="Couldn't price the slip";
    $("tot").innerHTML="";$("warn").textContent=`Pricing failed: ${e.message||e}`;return;
  }
  if(seq!==slipSeq)return;
  $("barprice").textContent=am(j.american);
  $("barsub").textContent=`${money(stake)} returns ${money(j.to_return)}`;
  const evColor=j.ev_dollars==null?"inherit":(j.ev_dollars>=0?"#1F7A3A":"#B23A25");
  $("tot").innerHTML=`
    <div class="trow"><span>Price</span><b>${am(j.american)}</b></div>
    <div class="trow"><span>Book implied chance</span><span>${pct(j.book_implied_prob)}</span></div>
    ${j.fair_prob!=null?`<div class="trow"><span>Fair chance</span><span>${pct(j.fair_prob)}</span></div>
    <div class="trow"><span>Total hold</span><span>${pct(j.total_hold)}</span></div>
    <div class="trow"><span>Expected value</span><span style="color:${evColor}">${money(j.ev_dollars)}</span></div>
    <div class="trow"><span>Same money as singles</span><span style="color:${evColor}">${
      j.as_singles&&j.as_singles.total_ev_dollars!=null?money(j.as_singles.total_ev_dollars):"—"}</span></div>`
    :`<div class="trow"><span>Expected value</span><span style="opacity:.6">not computed — a leg has no fair price</span></div>`}
    <div class="trow big"><span>To return</span><span>${money(j.to_return)}</span></div>`;
  $("warn").innerHTML=(j.notes||[]).map(h).join("<br>")||
    "Each leg you add multiplies the book's margin against you.";
}

function fmtTime(iso){
  if(!iso)return "";
  const d=new Date(iso); if(isNaN(d))return "";
  return d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});
}

$("bar").onclick=()=>{$("sheet").classList.add("open");$("scrim").classList.add("open");};
const shut=()=>{$("sheet").classList.remove("open");$("scrim").classList.remove("open");};
$("close").onclick=shut;$("scrim").onclick=shut;
$("pstake").oninput=priceSlip;
$("clear").onclick=()=>{slip=[];render();priceSlip();shut();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut();});
$("note").textContent="Schedules, scores and injuries: ESPN, free. Odds: The Odds API, "+
  "billed per credit. Research only — nothing here places a bet or touches a sportsbook account.";
render();priceSlip();loadUsage();
if(tab==="Injuries")loadInjuries();
</script>
