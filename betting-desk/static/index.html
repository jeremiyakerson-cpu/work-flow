<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betting Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23C9A227%22/%3E%3C/svg%3E">
<style>
  :root{
    --felt:#0F1512; --felt-2:#161E19; --felt-3:#1D2721; --rule:#26332C;
    --chalk:#E9E7DE; --dim:#87907F; --brass:#C9A227; --brass-soft:#8A731C;
    --up:#63C97F; --down:#DE5C48;
    --ticket:#F1EADA; --ink:#1A1713; --trule:#CFC4AC;
    --display:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
    --body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--felt);color:var(--chalk);font-family:var(--body);
       font-size:15px;line-height:1.4;padding-bottom:96px;font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  header{padding:14px 16px 0}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:.02em;white-space:nowrap}
  @media (max-width:420px){h1{font-size:23px}}
  h1 span{color:var(--brass)}
  .stamp{font-size:11px;color:var(--dim);text-align:right;line-height:1.35}
  .controls{display:flex;gap:8px;margin:12px 0 0;align-items:center;flex-wrap:wrap}
  .refresh{flex:1;min-width:150px;background:var(--brass);border:0;color:#14110A;
    font-weight:700;font-size:15px;padding:12px;border-radius:3px;cursor:pointer}
  .refresh:disabled{opacity:.55;cursor:wait}
  .mini{background:var(--felt-2);border:1px solid var(--rule);color:var(--chalk);
    font-size:13px;padding:10px 11px;border-radius:3px}
  .mini[type=number]{width:74px}

  .rail{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
  .rail::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
  .sport{flex:0 0 auto;background:var(--felt-2);border:1px solid var(--rule);color:var(--dim);
    font-family:var(--display);font-weight:700;font-size:17px;padding:8px 15px 7px;
    border-radius:2px;cursor:pointer;letter-spacing:.03em}
  .sport[aria-selected=true]{background:var(--brass);border-color:var(--brass);color:#14110A}
  .tabs{display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--rule);overflow-x:auto}
  .tab{background:none;border:0;padding:0 0 10px;color:var(--dim);font-size:14px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab[aria-selected=true]{color:var(--chalk);border-bottom-color:var(--brass)}

  main{padding:14px 12px 0}
  .banner{border:1px solid var(--rule);border-left:3px solid var(--brass-soft);background:var(--felt-2);
    border-radius:3px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5}
  .banner.err{border-left-color:var(--down)}
  .banner b{display:block;margin-bottom:3px}
  .banner span{color:var(--dim)}

  .sechead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
  .sechead h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0}
  .sechead span{font-size:11.5px;color:var(--dim)}

  .game{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;margin-bottom:9px;overflow:hidden}
  .cell{background:var(--felt-3);border:1px solid var(--rule);border-radius:3px;color:var(--chalk);
    font-size:13px;padding:7px 2px;cursor:pointer;text-align:center;line-height:1.2;
    display:flex;flex-direction:column;justify-content:center;min-height:48px}
  .cell .p{color:#9FB3F5}
  .cell .bk{font-size:9.5px;color:var(--dim);margin-top:1px}
  .cell.on{background:var(--brass);border-color:var(--brass);color:#14110A}
  .cell.on .p,.cell.on .bk{color:#4A3C0C}
  .cell.plus{border-color:var(--up)}
  .cell.none{opacity:.45;cursor:default;font-size:15px}
  .gfoot{padding:7px 11px;border-top:1px dashed var(--rule);display:flex;gap:13px;flex-wrap:wrap;
    font-size:11px;color:var(--dim)}
  .gfoot b{color:var(--chalk);font-weight:600}
  .gtime{padding:7px 11px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--dim);
    display:flex;justify-content:space-between}

  .play{background:var(--felt-2);border:1px solid var(--rule);border-left:3px solid var(--up);
    border-radius:3px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
  .play .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .play .pick{font-size:14.5px;font-weight:600}
  .play .ev{font-family:var(--display);font-weight:700;font-size:20px;color:var(--up)}
  .play .l2{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.5}

  .empty{border:1px dashed var(--rule);border-radius:4px;padding:26px 20px;text-align:center;
    color:var(--dim);font-size:13.5px}
  .empty strong{display:block;color:var(--chalk);font-size:15px;margin-bottom:6px}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ticket);color:var(--ink);
    border-top:3px solid var(--brass);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
  .bar .price{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
  .bar .sub{font-size:11.5px;opacity:.7}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ticket);color:var(--ink);
    max-height:84vh;overflow-y:auto;border-top:3px solid var(--brass);
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);
    visibility:hidden;transition:transform .22s,visibility 0s .22s}
  .sheet.open{transform:translateY(0);visibility:visible;transition:transform .22s}
  .scrim{position:fixed;inset:0;background:rgba(8,12,10,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.open{opacity:1;pointer-events:auto}
  .shead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--trule);
    padding-bottom:10px;margin-bottom:12px}
  .shead h2{font-family:var(--display);font-size:22px;margin:0}
  .x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink);padding:4px 8px}
  .leg{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--trule)}
  .leg .pk{font-weight:600;font-size:14px}
  .leg .mt{font-size:11.5px;opacity:.65;margin-top:2px}
  .leg .od{font-family:var(--display);font-weight:700;font-size:18px}
  .leg button{background:none;border:0;color:var(--down);font-size:12px;cursor:pointer;padding:2px 0 0}
  .srow{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
  .srow input{width:92px;padding:8px 10px;font-size:16px;border:1px solid var(--trule);
    border-radius:2px;background:#FBF7EC;color:var(--ink)}
  .tot{border-top:1px solid var(--trule);margin-top:12px;padding-top:12px}
  .trow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
  .trow.big{font-family:var(--display);font-weight:700;font-size:20px;padding-top:8px}
  .warn{margin-top:14px;padding:10px 12px;background:#E6DCC4;border-left:3px solid var(--brass-soft);
    font-size:12px;line-height:1.45}
  .clr{margin-top:12px;width:100%;padding:11px;background:none;border:1px solid var(--trule);
    border-radius:2px;font-size:13px;cursor:pointer;color:var(--ink)}
  .note{padding:6px 16px 26px;font-size:11.5px;color:var(--dim);line-height:1.5}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #14110A;border-top-color:transparent;
    border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---- header status ---- */
  .credits{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;
    border-radius:10px;border:1px solid var(--rule);color:var(--chalk);background:var(--felt-2);margin-bottom:3px}
  .credits.ok{border-color:var(--up);color:var(--up)}
  .credits.low{border-color:var(--brass);color:var(--brass)}
  .credits.out{border-color:var(--down);color:var(--down)}

  /* ---- filters ---- */
  .filters{display:flex;gap:8px;padding:10px 16px 0;flex-wrap:wrap;align-items:center}
  .filters label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim);
    letter-spacing:.05em;text-transform:uppercase;flex:1 1 120px;max-width:190px}
  .filters select,.filters input{background:var(--felt-2);border:1px solid var(--rule);color:var(--chalk);
    font-size:13px;padding:8px 9px;border-radius:3px;width:100%;font-family:inherit}
  .filters[hidden]{display:none}

  /* ---- generic game card ---- */
  .gtitle{display:flex;justify-content:space-between;gap:10px;padding:10px 11px 4px;align-items:baseline}
  .gtitle b{font-size:14px}
  .gtitle span{font-size:11px;color:var(--dim);white-space:nowrap}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;
    border-radius:2px;margin-left:6px;vertical-align:1px}
  .badge.live{background:var(--down);color:#fff}
  .badge.final{background:var(--rule);color:var(--chalk)}
  .badge.best{background:var(--brass);color:#14110A}
  .mkt{padding:4px 11px 8px}
  .mkt h3{font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin:4px 0 5px;font-weight:600;
    text-transform:uppercase;display:flex;justify-content:space-between}
  .mkt h3 i{font-style:normal;text-transform:none;letter-spacing:0}
  .sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px}
  .cell{position:relative;text-align:left;align-items:stretch;padding:7px 0;cursor:default;min-width:0}
  .cell .pk{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;
    padding:0 26px 0 8px;width:100%}
  .cell .lb{font-size:12px;display:flex;gap:4px;align-items:baseline;min-width:0}
  .cell .lb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cell .lb .pt,.cell .lb .badge{flex:none;white-space:nowrap}
  .cell .lb .badge{margin-left:2px}
  .cell .row{display:flex;gap:6px;align-items:baseline;margin-top:2px}
  .cell .p{font-family:var(--display);font-weight:700;font-size:17px}
  .cell .evp{font-size:11px;margin-left:auto;color:var(--dim)}
  .cell .evp.pos{color:var(--up)}
  .cell .bk{display:block}
  .cell.best{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
  .cell.on .evp,.cell.on .lb{color:#14110A}
  .trk{position:absolute;top:4px;right:3px;background:none;border:0;color:var(--dim);font-size:15px;
    cursor:pointer;padding:2px 5px;line-height:1}
  .trk.on{color:var(--brass)}
  .cell.on .trk{color:#4A3C0C}

  .play{position:relative}
  .play .ev.neg{color:var(--down)}
  .play.best{border-left-color:var(--brass);border-color:var(--brass);background:var(--felt-3)}
  .play .acts{display:flex;gap:8px;margin-top:8px}
  .btn{background:var(--felt-3);border:1px solid var(--rule);color:var(--chalk);font-size:12px;
    padding:6px 10px;border-radius:3px;cursor:pointer;font-family:inherit}
  .btn.on{border-color:var(--brass);color:var(--brass)}
  .btn.danger{color:var(--down)}

  /* ---- loading skeleton ---- */
  .skel{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;height:132px;margin-bottom:9px;
    background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
    background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .banner.caution{border-left-color:var(--brass)}
  .banner .retry{margin-top:8px}
  .banner ul{margin:4px 0 0;padding-left:18px;color:var(--dim)}

  /* ---- tracker ---- */
  .sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
  .stat{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
  .stat b{display:block;font-family:var(--display);font-size:22px}
  .stat span{font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .tk{background:var(--felt-2);border:1px solid var(--rule);border-radius:3px;padding:11px 12px;margin-bottom:8px}
  .tk .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .tk .l2{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.55}
  .tk .clv{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}

  .sport.nodemo{opacity:.5}
  .sport.nodemo[aria-selected=true]{opacity:1}
  .gacts{padding:0 11px 9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--dim)}
  .props{border-top:1px dashed var(--rule);padding-top:4px}
  .props .one{font-size:11.5px;color:var(--dim);padding:3px 0}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .seg button{background:var(--felt-2);border:0;color:var(--dim);font-size:13px;padding:7px 14px;cursor:pointer;font-family:inherit}
  .seg button[aria-pressed=true]{background:var(--brass);color:#14110A;font-weight:700}
  .tbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .chart{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;padding:10px 12px 8px;margin-bottom:12px}
  .chart h3{font-size:12px;margin:0 0 2px;font-weight:600}
  .chart p{font-size:11px;color:var(--dim);margin:0 0 6px}
  .chart svg{display:block;max-width:100%;height:auto;overflow:visible}
  .chart .ax{stroke:var(--rule);stroke-width:1}
  .chart .zero{stroke:var(--dim);stroke-width:1}
  .chart text{fill:var(--dim);font-size:10px;font-family:var(--body)}
  .chart .hit{fill:transparent}
  .chart .hit:hover{fill:rgba(255,255,255,.06)}
  table.wk{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
  table.wk th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--rule)}
  table.wk td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--rule)}
  table.wk th:first-child,table.wk td:first-child{text-align:left}
  .res{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:2px;margin-right:6px;vertical-align:1px}
  .res.won{background:var(--up);color:#0F1512}.res.lost{background:var(--down);color:#fff}
  .res.push,.res.pending,.res.live,.res.unknown,.res.ungradeable{background:var(--rule);color:var(--chalk)}
  .clv small{font-family:var(--body);font-weight:400;font-size:10px;color:var(--dim);display:block;text-align:right}

  /* ---- live: budget meter, toasts, alerts ---- */
  .auto{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);background:none;
    border:0;padding:2px 0;cursor:pointer;font-family:inherit}
  .auto .meter{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
  .auto .meter i{display:block;height:100%;background:var(--up)}
  .auto.warn .meter i{background:var(--brass)} .auto.full .meter i{background:var(--down)}
  .auto.on{color:var(--chalk)}
  .meterbig{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:6px 0 4px}
  .meterbig i{display:block;height:100%;background:var(--up)}
  .meterbig.warn i{background:var(--brass)} .meterbig.full i{background:var(--down)}
  .toasts{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:10px;left:10px;z-index:60;display:flex;flex-direction:column;
    align-items:flex-end;gap:8px;pointer-events:none}
  .toast{pointer-events:auto;max-width:360px;width:100%;background:var(--felt-3);border:1px solid var(--rule);
    border-left:3px solid var(--up);border-radius:3px;padding:10px 12px;font-size:12.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer}
  .toast.move{border-left-color:var(--brass)}
  .toast b{display:block;font-size:13.5px;margin-bottom:2px}
  .toast span{color:var(--dim)}
  .al{background:var(--felt-2);border:1px solid var(--rule);border-left:3px solid var(--up);border-radius:3px;
    padding:10px 12px;margin-bottom:8px}
  .al.move{border-left-color:var(--brass)}
  .al.unread{background:var(--felt-3)}
  .al .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px;font-weight:600}
  .al .l1 small{font-weight:400;font-size:11px;color:var(--dim);white-space:nowrap}
  .al .l2{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
  .panel{background:var(--felt-2);border:1px solid var(--rule);border-radius:4px;padding:11px 12px;margin-bottom:12px;font-size:13px}
  .panel h3{font-family:var(--display);font-size:17px;margin:0 0 6px}
  .panel .muted{color:var(--dim);font-size:11.5px;line-height:1.5}
  .form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
  .form label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim);letter-spacing:.05em;
    text-transform:uppercase;flex:1 1 110px;max-width:170px}
  .form input[type=number]{background:var(--felt);border:1px solid var(--rule);color:var(--chalk);font-size:13px;
    padding:8px 9px;border-radius:3px;width:100%;font-family:inherit}
  .form .chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:12.5px;color:var(--chalk);letter-spacing:0}
  table.sch{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.sch th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:left;padding:5px 4px;border-bottom:1px solid var(--rule)}
  table.sch td{padding:5px 4px;border-bottom:1px solid var(--rule);vertical-align:top}

  @media (min-width:900px){
    main,.filters,header,.rail,.tabs,.note{max-width:1180px;margin-left:auto;margin-right:auto}
    .gamegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
    .gamegrid .game{margin-bottom:0}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Betting <span>Desk</span></h1>
    <div class="stamp"><span class="credits" id="credits" title="The Odds API credits remaining">credits …</span><br>
      <button class="auto" id="auto" title="Auto-refresh credit budget for today">auto …</button><br>
      <span id="stamp">Not refreshed yet</span></div>
  </div>
  <div class="controls">
    <button class="refresh" id="go">Refresh board</button>
    <label class="mini">$<input class="mini" id="stake" type="number" value="10" min="1" step="1"
      aria-label="Stake in dollars" style="border:0;padding:0 0 0 4px;background:none"></label>
    <select class="mini" id="method" aria-label="De-vig method">
      <option value="power">Power de-vig</option>
      <option value="multiplicative">Multiplicative</option>
      <option value="additive">Additive</option>
    </select>
  </div>
</header>

<div class="rail" id="rail" role="tablist" aria-label="League"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="filters" id="filters">
  <label>Book<select id="f-book"></select></label>
  <label>Market<select id="f-market"></select></label>
  <label>Min edge %<input id="f-edge" type="number" step="0.5" min="0" value="0" inputmode="decimal"></label>
  <label>Sort<select id="f-sort"></select></label>
</div>
<main id="out"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<p class="note" id="note"></p>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Parlay slip">
  <div class="shead"><h2>Parlay slip</h2><button class="x" id="close" aria-label="Close">&times;</button></div>
  <div id="legs"></div>
  <div class="srow"><label for="pstake">Stake $</label>
    <input id="pstake" type="number" value="10" min="0" step="1"></div>
  <div class="tot" id="tot"></div><div class="warn" id="warn"></div>
  <button class="clr" id="clear">Clear all legs</button>
</section>
<div class="bar" id="bar">
  <div><div id="barlegs">No legs yet</div><div class="sub" id="barsub">Tap any price to add a leg</div></div>
  <div class="price" id="barprice">—</div>
</div>

<script>
/* Research only. Nothing on this page talks to a sportsbook account. */
const LEAGUE_LABELS={mlb:"MLB",nfl:"NFL",ncaaf:"CFB",nba:"NBA",nhl:"NHL",ncaab:"CBB",wnba:"WNBA",epl:"EPL",mls:"MLS"};
// Replaced by /api/sports when the backend serves it; this list is the fallback.
let LEAGUES=Object.entries(LEAGUE_LABELS), CATALOG=null;
const TABS=["Board","Plays","Tracked","Alerts","Injuries"];
const MARKET_NAMES={h2h:"Moneyline",spreads:"Spread",totals:"Total"};
const TRACK_KEY="bd.tracked.v1", PREF_KEY="bd.prefs.v1", ALERT_KEY="bd.alerts.v1";

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const prefs=Object.assign({league:"mlb",tab:"Board",book:"best",market:"all",edge:0,sort:"",tview:"plays"},
  store.get(PREF_KEY,{}));
let league=prefs.league,tab=TABS.includes(prefs.tab)?prefs.tab:"Board";
let data=null,inj=null,slip=[],busy=false,loadErr=null,usage=null;
let tracked=store.get(TRACK_KEY,[]); if(!Array.isArray(tracked))tracked=[];
let REG={};   // render-time registry of priced sides, keyed for the slip/track buttons
let PROPS={}; // per-game props panels: "league|odds_id" -> {open,state,data,cost,msg}
let HIST={};  // per-game line-movement panels: "league|odds_id" -> {open,state,markets:{key:data|{error}}}
let lastResultsCheck=0, resultsBusy=false, resultsErr=null;
// Alerts + auto-refresh. alertPrefs is per browser: notifications on/off and the last alert toasted.
let ALERTS={list:[],unread:0,latest:0,config:null,loaded:false,err:null}, SCHED=null, autoApplied={};
const alertPrefs=Object.assign({notify:false,seen:null},store.get(ALERT_KEY,{}));
const saveAlertPrefs=()=>store.set(ALERT_KEY,alertPrefs);

const $=id=>document.getElementById(id);
const out=$("out"),rail=$("rail"),tabsEl=$("tabs");
const money=n=>n==null||isNaN(n)?"—":(n<0?"-$":"$")+Math.abs(n).toFixed(2);
const am=n=>n==null||isNaN(n)?"—":(n>0?"+":"")+n;
const pct=(n,d=1)=>n==null||isNaN(n)?"—":(n*100).toFixed(d)+"%";
const spct=(n,d=1)=>n==null||isNaN(n)?"—":(n>0?"+":"")+(n*100).toFixed(d)+"%";
const dec=a=>a>0?1+a/100:1+100/(-a);
const h=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const mname=k=>MARKET_NAMES[k]||String(k).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())
  .replace(/\b(Td|Ml|Rbi|Sog|Pra|[HQP]\d)\b/g,m=>m.toUpperCase());
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const savePrefs=()=>store.set(PREF_KEY,{league,tab,book:prefs.book,market:prefs.market,edge:prefs.edge,sort:prefs.sort,tview:prefs.tview});
const saveTracked=()=>store.set(TRACK_KEY,tracked);

/* ---------------- chrome ---------------- */
function buildRail(){
  rail.innerHTML="";
  LEAGUES.forEach(([k,l])=>{const b=document.createElement("button");
    b.className="sport";b.textContent=l;b.setAttribute("role","tab");
    const sp=CATALOG&&CATALOG.sports.find(x=>x.league===k);
    if(CATALOG&&CATALOG.demo_mode&&sp&&sp.demo_fixture===false){b.classList.add("nodemo");b.title="No demo fixture for this league";}
    b.onclick=()=>{if(league===k)return;league=k;data=null;inj=null;loadErr=null;savePrefs();render();refresh();};
    rail.appendChild(b);});
}
buildRail();
// League list, demo coverage and props availability, if the backend publishes them.
async function loadCatalog(){
  try{
    const r=await fetch("/api/sports"); if(!r.ok)return;
    const j=await r.json(); if(!j||!Array.isArray(j.sports)||!j.sports.length)return;
    CATALOG=j;
    LEAGUES=j.sports.filter(x=>x&&x.league).map(x=>[x.league,LEAGUE_LABELS[x.league]||String(x.league).toUpperCase()]);
    buildRail();render();
  }catch(e){}
}
TABS.forEach(t=>{const b=document.createElement("button");b.className="tab";b.textContent=t;
  b.setAttribute("role","tab");
  b.onclick=()=>{tab=t;savePrefs();render();if(t==="Injuries"&&!inj)loadInjuries();
    if(t==="Tracked")checkResults(false);if(t==="Alerts")openAlerts();};tabsEl.appendChild(b);});

$("go").onclick=refresh;
$("auto").onclick=()=>{tab="Alerts";savePrefs();render();openAlerts();};
$("stake").onchange=()=>{if(data)refresh();};
$("method").onchange=()=>{if(data)refresh();};
$("f-book").onchange=e=>{prefs.book=e.target.value;savePrefs();render();};
$("f-market").onchange=e=>{prefs.market=e.target.value;savePrefs();render();};
$("f-edge").oninput=e=>{prefs.edge=Math.max(0,+e.target.value||0);savePrefs();render();};
$("f-sort").onchange=e=>{prefs.sort=e.target.value;savePrefs();render();};
$("f-edge").value=prefs.edge;

/* ---------------- data ---------------- */
async function refresh(){
  if(busy)return; busy=true; loadErr=null;
  const btn=$("go"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Pulling live data…';
  render();
  const want=league;
  try{
    const stake=$("stake").value||10, method=$("method").value;
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),45000);
    let r;
    try{r=await fetch(`/api/board/${want}?stake=${encodeURIComponent(stake)}&method=${method}`,{signal:ctl.signal});}
    finally{clearTimeout(timer);}
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok||!j) throw new Error((j&&j.detail)||`Server answered HTTP ${r.status}`);
    if(want!==league)return;               // user switched league mid-flight
    data=normalise(j);
    if(data.usage)setUsage(data.usage);
    updateTracked(data);
    if(Array.isArray(j.alerts)&&j.alerts.length)pollAlerts();
  }catch(e){
    if(want!==league)return;
    loadErr=e.name==="AbortError"?"The server took too long to answer (45s).":String(e.message||e);
  }finally{
    busy=false; btn.disabled=false; btn.textContent="Refresh board";
    render();
  }
}

// Coerce the payload into the shape the renderer relies on, whatever the backend sends.
function normalise(j){
  j.games=Array.isArray(j.games)?j.games:[];
  j.plays=Array.isArray(j.plays)?j.plays:[];
  j.errors=Array.isArray(j.errors)?j.errors:[];
  j.warnings=Array.isArray(j.warnings)?j.warnings:[];
  j.your_books=Array.isArray(j.your_books)?j.your_books:[];
  j.summary=j.summary||{};
  j.games.forEach(g=>{g.markets=g.markets&&typeof g.markets==="object"?g.markets:{};
    g.home=g.home||{};g.away=g.away||{};});
  return j;
}

async function loadUsage(){
  try{const r=await fetch("/api/usage");setUsage(await r.json());}catch(e){setUsage(null);}
}
function setUsage(u){usage=u;renderCredits();}
function renderCredits(){
  const el=$("credits"),u=usage||{};
  el.className="credits";
  if(u.demo){el.textContent="DEMO · no credits spent";el.title="Demo mode reads frozen fixtures.";return;}
  if(u.error){el.textContent="no API key";el.classList.add("out");el.title=u.error;return;}
  const n=u.credits_remaining;
  if(n==null){el.textContent="credits: refresh to see";return;}
  el.textContent=`${n} credits left`;
  el.classList.add(n<=0?"out":n<50?"low":"ok");
  el.title=`Used ${u.credits_used??"?"} · last call cost ${u.last_call_cost??"?"}`;
}

async function loadInjuries(){
  const want=league;
  try{const r=await fetch(`/api/injuries/${want}`);inj=await r.json();if(!r.ok)throw new Error(inj.detail||r.status);}
  catch(e){inj={injuries:[],error:String(e.message||e)};}
  if(want===league)render();
}

/* ---------------- filters ---------------- */
function marketKeys(){
  const s=new Set();
  if(data){data.games.forEach(g=>{Object.keys(g.markets).forEach(k=>s.add(k));
    const pr=PROPS[propKey(g)];if(pr&&pr.data)pr.data.props.forEach(p=>p.market&&s.add(p.market));});
    data.plays.forEach(p=>p.market&&s.add(p.market));}
  return [...s];
}
function fillSelect(el,opts,val){
  const html=opts.map(([v,l])=>`<option value="${h(v)}">${h(l)}</option>`).join("");
  if(el.dataset.sig!==html){el.innerHTML=html;el.dataset.sig=html;}
  el.value=opts.some(o=>o[0]===val)?val:opts[0][0];
  return el.value;
}
function syncFilters(){
  const show=data&&!data.error&&(tab==="Board"||tab==="Plays");
  $("filters").hidden=!show;
  if(!show)return;
  const books=data.your_books.length?data.your_books:[...new Set(data.plays.map(p=>p.book))];
  prefs.book=fillSelect($("f-book"),[["best","Best of my books"],...books.map(b=>[b,b])],prefs.book);
  prefs.market=fillSelect($("f-market"),[["all","All markets"],...marketKeys().map(k=>[k,mname(k)])],prefs.market);
  const sorts=tab==="Plays"
    ?[["ev","EV % (high first)"],["evd","EV $ (high first)"],["kelly","Kelly (high first)"],["time","Start time"],["book","Book"]]
    :[["time","Start time"],["edge","Best edge first"]];
  const sel=fillSelect($("f-sort"),sorts,prefs.sort);
  prefs.sort=sel;
}
const minEdge=()=>(+prefs.edge||0)/100;
const marketOk=k=>prefs.market==="all"||prefs.market===k;
function filteredPlays(){
  return data.plays.filter(p=>marketOk(p.market)&&(prefs.book==="best"||p.book===prefs.book)
    &&typeof p.ev_per_dollar==="number"&&p.ev_per_dollar>=minEdge()&&p.ev_per_dollar>0);
}
// Highest-EV play passing the filters. With no +EV play and no min edge set,
// fall back to the price closest to fair so the board still says where to look.
function bestPlay(){
  const top=filteredPlays().slice().sort((a,b)=>b.ev_per_dollar-a.ev_per_dollar)[0];
  if(top||minEdge()>0)return top||null;
  let best=null;
  data.games.forEach(g=>Object.entries(g.markets).forEach(([k,m])=>{
    if(!marketOk(k)||!m||!Array.isArray(m.sides))return;
    m.sides.forEach(s=>{const y=pickBook(s);
      if(y&&typeof y.ev_per_dollar==="number"&&(!best||y.ev_per_dollar>best.ev_per_dollar))
        best={game:g.name,espn_id:g.espn_id,start_utc:g.start_utc,market:k,side:s.label,point:s.point??null,
          book:y.book,price:y.price,fair_price:s.fair_price,fair_prob:s.fair_prob,fair_source:m.fair_source,
          ev_per_dollar:y.ev_per_dollar,ev_dollars:y.ev_dollars,kelly:y.kelly,
          quarter_kelly:y.kelly!=null?y.kelly/4:null,book_count:m.book_count};});
  }));
  return best;
}
const playKey=p=>[league,p.game,p.market,p.side,p.point??"",p.book].join("|");

/* ---------------- render ---------------- */
function renderTabs(){
  [...tabsEl.children].forEach((b,i)=>{b.setAttribute("aria-selected",TABS[i]===tab);
    if(TABS[i]==="Tracked")b.textContent=`Tracked${tracked.length?` (${tracked.length})`:""}`;
    if(TABS[i]==="Alerts")b.textContent=`Alerts${ALERTS.unread?` (${ALERTS.unread})`:""}`;});
}
// Background polls repaint the Alerts tab, and only the chrome anywhere else.
function repaint(){if(tab==="Alerts"){if(!out.contains(document.activeElement))render();}else{renderTabs();renderAuto();}}
function render(){
  [...rail.children].forEach((b,i)=>b.setAttribute("aria-selected",LEAGUES[i][0]===league));
  renderTabs();
  if(data&&data.generated_at)
    $("stamp").textContent=`${data.auto?"Auto-updated":"Refreshed"} ${new Date(data.odds_fetched_at||data.generated_at).toLocaleTimeString()}`;
  renderCredits();renderAuto();
  syncFilters();
  REG={};
  if(tab==="Tracked")return renderTracked();
  if(tab==="Alerts")return renderAlerts();
  if(tab==="Injuries")return renderInjuries();

  const top=statusBanners();
  if(!data){
    if(busy){out.innerHTML=top+`<div class="gamegrid">${'<div class="skel"></div>'.repeat(4)}</div>`;return;}
    out.innerHTML=top||`<div class="empty"><strong>Nothing loaded yet</strong>
      Pick a league and hit Refresh. Schedules come free from ESPN; odds cost credits.</div>`;
    wire();return;
  }
  out.innerHTML=top+(tab==="Plays"?playsHTML():boardHTML());
  wire();
}

function statusBanners(){
  let s="";
  if(busy&&data)s+=`<div class="banner"><b><span class="spin" style="border-color:var(--chalk);border-top-color:transparent"></span>Refreshing…</b>
    <span>Showing the previous board until the new one arrives.</span></div>`;
  if(loadErr)s+=`<div class="banner err" role="alert"><b>Refresh failed</b><span>${h(loadErr)}</span>
    ${data?`<span><br>Still showing the last good board from ${new Date(data.generated_at).toLocaleTimeString()}.</span>`:""}
    <div class="retry"><button class="btn" data-act="retry">Try again</button></div></div>`;
  if(!data)return s;
  if(data.demo_mode)s+=`<div class="banner"><b>Demo mode</b><span>Frozen fixtures from Sep 15 2026. No credits spent, nothing live.</span></div>`;
  if(data.note)s+=`<div class="banner caution"><b>Note</b><span>${h(data.note)}</span></div>`;
  const errs=data.errors;
  if(errs.length){
    const what={odds:"Odds feed",schedule:"ESPN schedule",board:"Board builder"};
    s+=`<div class="banner caution" role="status"><b>Partial board — ${errs.length} source${errs.length>1?"s":""} failed</b>
      <span>Everything that did load is shown below.</span><ul>${errs.map(e=>
      `<li><b style="display:inline;color:var(--chalk)">${h(what[e.source]||e.source)}</b> (${h(e.kind)}): ${h(e.message)}</li>`).join("")}</ul>
      ${errs.some(e=>e.kind==="rate_limit")?`<span>Rate limited: wait a minute before refreshing, or you'll burn calls for nothing.</span>`:""}</div>`;
  }
  if(data.stale_odds)s+=`<div class="banner caution"><b>Odds are from cache</b><span>The feed failed just now, so these are the last prices that loaded. Treat them as stale.</span></div>`;
  if(data.warnings.length)s+=`<div class="banner caution"><b>${data.warnings.length} market${data.warnings.length>1?"s":""} skipped</b>
    <span>${data.warnings.slice(0,5).map(h).join("<br>")}</span></div>`;
  return s;
}

function bestHTML(){
  const b=bestPlay();
  if(!b)return "";
  if(b.ev_per_dollar<=0)return `<div class="sechead"><h2>Closest to fair</h2><span>no price beats fair value</span></div>`+
    playCard(b,true,"Nothing on the board is +EV. This is the least-bad price your books show — a reference point, not a play.");
  return `<div class="sechead"><h2>Best play</h2><span>highest EV that passes your filters</span></div>`+playCard(b,true);
}

function boardHTML(){
  const gs=data.games;
  if(!gs.length)return `<div class="empty"><strong>No games on the board</strong>
    ${data.errors.length?"The sources above failed, so there is nothing to show yet.":
      "Neither ESPN nor the odds feed lists a game for "+h(league.toUpperCase())+" right now. Off-season or an off day."}</div>`;
  const withOdds=gs.filter(g=>g.has_odds), without=gs.filter(g=>!g.has_odds);
  const sm=data.summary;
  let html=`<div class="banner"><b>${sm.games_with_odds??withOdds.length} of ${sm.games_total??gs.length} games priced</b>
    <span>Fair value from ${data.sharp_book?"sharp book "+h(data.sharp_book):"a consensus of the books in the feed"},
    ${h(data.devig_method)} de-vig. Your books: ${h(data.your_books.join(", ")||"none set")}.
    ${sm.plays_found??data.plays.length} spot${(sm.plays_found??data.plays.length)===1?"":"s"} above fair value.</span></div>`;
  html+=bestHTML();
  const edgeOf=g=>Math.max(-9,...Object.entries(g.markets).filter(([k,m])=>marketOk(k)&&m&&Array.isArray(m.sides))
    .flatMap(([,m])=>m.sides.map(s=>(pickBook(s)||{}).ev_per_dollar??-9)));
  const sorted=withOdds.slice().sort(prefs.sort==="edge"?(a,b)=>edgeOf(b)-edgeOf(a)
    :(a,b)=>(Date.parse(a.start_utc)||0)-(Date.parse(b.start_utc)||0));
  const cards=sorted.map(gameCard).filter(Boolean);
  html+=`<div class="sechead"><h2>Board</h2><span>${prefs.book==="best"?"best of your books":h(prefs.book)}${prefs.market==="all"?"":" · "+h(mname(prefs.market))}</span></div>`;
  html+=cards.length?`<div class="gamegrid">${cards.join("")}</div>`
    :`<div class="empty"><strong>No ${h(mname(prefs.market))} prices</strong>No priced game carries that market. Try “All markets”.</div>`;
  if(without.length)html+=`<div class="sechead" style="padding-top:14px"><h2>No prices</h2>
    <span>${without.length} game${without.length===1?"":"s"}</span></div><div class="gamegrid">`+
    without.map(g=>`<div class="game"><div class="gtitle"><b>${h(g.name)}${stateBadge(g)}</b>
      <span>${fmtTime(g.start_utc)}</span></div>
      <div class="gfoot"><span>No book in the feed is quoting this game yet.</span></div></div>`).join("")+`</div>`;
  return html;
}

function stateBadge(g){
  if(g.state==="in")return `<span class="badge live">LIVE</span>`;
  if(g.state==="post")return `<span class="badge final">FINAL</span>`;
  return "";
}

// which of your books' prices to show for a side
function pickBook(s){
  const ys=Array.isArray(s.your_books)?s.your_books:[];
  if(prefs.book!=="best")return ys.find(y=>y.book===prefs.book)||null;
  return ys.reduce((a,y)=>!a||y.ev_per_dollar>a.ev_per_dollar?y:a,null);
}

function mktHead(k,m){
  const off=Object.entries(m.off_line_books||{});
  const offTxt=off.length?` · <span title="${h(off.map(([b,o])=>`${b} deals ${fmtPoint(k,o&&o.point)}`).join(", "))} — left out of fair value">${off.length} off-line</span>`:"";
  return `<h3>${h(mname(k))}<i>${h(m.fair_source||"")}${m.book_count?` · ${plural(m.book_count,"book")}`:""}${offTxt}</i></h3>`;
}
function gameCard(g){
  const best=bestPlay();
  const mk=Object.entries(g.markets).filter(([k])=>marketOk(k));
  const props=propsHTML(g,best);
  if(!mk.length&&!props)return "";
  const sections=mk.map(([k,m])=>{
    if(!m||!Array.isArray(m.sides)||!m.sides.length)
      return `<div class="mkt"><h3>${h(mname(k))}<i>not quoted</i></h3></div>`;
    return `<div class="mkt">${mktHead(k,m)}
      <div class="sides">${m.sides.map((s,i)=>sideCell(g,k,m,s,i,best)).join("")}</div></div>`;
  }).join("");
  const title=g.name||`${g.away.name||"Away"} at ${g.home.name||"Home"}`;
  return `<div class="game"><div class="gtitle"><b>${h(title)}${stateBadge(g)}</b><span>${fmtTime(g.start_utc)}</span></div>
    ${sections}${props}
    ${g.venue||g.match_confidence!=null&&g.match_confidence<0.72?`<div class="gtime"><span>${h(g.venue||"")}</span>
      <span>${g.match_confidence===0?"odds feed only":""}</span></div>`:""}</div>`;
}

function fmtPoint(market,pt){
  if(pt==null||pt==="")return "";
  return /spread/.test(String(market))&&pt>0?"+"+pt:String(pt);
}

function sideCell(g,market,m,s,i,best){
  const mine=pickBook(s);
  const name=s.display??s.label??["Side A","Side B"][i]??"Side", pt=fmtPoint(market,s.point);
  const label=`${name}${pt?" "+pt:""}`;
  const lb=badge=>`<span class="lb" title="${h(label)}"><span class="nm">${h(name)}</span>${pt?`<span class="pt">${h(pt)}</span>`:""}${badge||""}</span>`;
  const push=s.push_possible?` · <span title="Whole-number line: a push refunds the stake">push?</span>`:"";
  if(!mine)return `<div class="cell none" title="Your book doesn't quote this side">
      <span class="pk">${lb()}<span class="row"><span class="p">—</span>
      <span class="evp">fair ${am(s.fair_price)}</span></span></span></div>`;
  const p={game:g.name||`${g.away.name} at ${g.home.name}`,espn_id:g.espn_id,odds_id:g.odds_id??null,start_utc:g.start_utc,
    home:g.home.name??null,away:g.away.name??null,
    market,side:s.label,point:s.point??null,book:mine.book,price:mine.price,fair_prob:s.fair_prob,
    fair_price:s.fair_price,ev_per_dollar:mine.ev_per_dollar,ev_dollars:mine.ev_dollars,
    fair_source:m.fair_source,label:`${s.label??name}${pt?" "+pt:""} (${mname(market)})`};
  const k=playKey(p); REG[k]=p;
  const isBest=best&&playKey(best)===k;
  const on=slip.some(l=>l.id===k)?" on":"";
  const edge=mine.ev_per_dollar;
  const plus=edge>0&&edge>=minEdge()?" plus":"";
  const tr=isTracked(k);
  return `<div class="cell${on}${plus}${isBest?" best":""}">
    <button class="pk" data-slip="${h(k)}" aria-label="Add ${h(label)} ${am(mine.price)} to slip">
      ${lb(isBest?`<span class="badge best">${edge>0?"BEST":"CLOSEST"}</span>`:"")}
      <span class="row"><span class="p">${am(mine.price)}</span>
      <span class="evp${edge>0?" pos":""}">${spct(edge)}</span></span>
      <span class="bk">${h(mine.book)} · fair ${am(s.fair_price)}${push}</span></button>
    <button class="trk${tr?" on":""}" data-track="${h(k)}" title="${tr?"Stop tracking":"Track this play"}"
      aria-label="${tr?"Stop tracking":"Track"} ${h(label)}">${tr?"★":"☆"}</button></div>`;
}

/* ---------------- props (per game, opt-in) ----------------
   Needs an Odds API event id on the game (odds_id). Live props cost a credit
   per market, so outside demo mode the first tap only prices the call
   (dry_run) and a second tap spends the credits. */
const propKey=g=>`${league}|${g.odds_id}`;

/* ---------------- line movement (/api/history, free: reads stored snapshots) ---------------- */
function histHTML(g,hs){
  if(!hs.open||hs.state!=="ready")return hs.state==="error"?`<div class="banner caution" style="margin:0 11px 9px"><b>No line history</b><span>${h(hs.msg)}</span></div>`:"";
  const blocks=Object.entries(hs.markets).filter(([k])=>marketOk(k)).map(([k,d])=>{
    if(d.error)return `<div class="mkt"><h3>${h(mname(k))}</h3><div class="one">${h(d.error)}</div></div>`;
    const fair=Array.isArray(d.fair)?d.fair:[];
    const lab=fair.length&&fair[0].sides&&fair[0].sides[0]?fair[0].sides[0].label:"";
    const pts=fair.filter(f=>f.sides&&f.sides[0]).map(f=>({avg:f.sides[0].fair_prob,
      tip:`${new Date(f.t).toLocaleString()} · ${f.sides[0].label}${f.line!=null?" "+fmtPoint(k,f.line):""}: fair ${am(f.sides[0].fair_price)} (${pct(f.sides[0].fair_prob)}) · ${plural(f.book_count,"book")}`}));
    const mine=new Set(data.your_books);
    const ser=(Array.isArray(d.series)?d.series:[]).filter(x=>!mine.size||mine.has(x.book))
      .sort((a,b)=>(b.moves||0)-(a.moves||0)).slice(0,6);   // lines that actually moved first
    return `<div class="mkt"><h3>${h(mname(k))}<i>${plural(d.snapshots||0,"snapshot")}</i></h3>
      ${pts.length>1?`<div class="chart" style="margin-bottom:6px"><p>Fair chance, ${h(lab)}, as the market moved</p>${barLineSVG(pts,v=>pct(v,1),true,innerWidth>=900?500:320,true)}</div>`:""}
      ${ser.map(x=>`<div class="one">${h(x.book)} · ${h(x.player?x.player+" ":"")}${h(x.side)}${x.point!=null?" "+h(fmtPoint(k,x.point)):""}:
        ${am(x.open)} → <b style="color:var(--chalk)">${am(x.current)}</b> (${plural(x.moves||0,"move")})</div>`).join("")||
        `<div class="one">${h(d.note||"No snapshots yet.")}</div>`}</div>`;
  });
  return `<div class="props">${blocks.join("")||`<div class="gacts">Nothing recorded for the markets you're filtering on.</div>`}</div>`;
}
async function loadHistory(g){
  const k=propKey(g),want=league;
  if(HIST[k]&&HIST[k].state==="ready"){HIST[k].open=!HIST[k].open;render();return;}
  HIST[k]={state:"loading"};render();
  const keys=Object.keys(g.markets).filter(m=>g.markets[m]);
  const got=await Promise.all(keys.map(async m=>{
    try{
      const r=await fetch(`/api/history/${encodeURIComponent(want)}/${encodeURIComponent(g.odds_id)}?market=${encodeURIComponent(m)}&method=${encodeURIComponent($("method").value)}`);
      const j=await r.json().catch(()=>null);
      if(r.status===404&&!(j&&typeof j.detail==="string"&&j.detail.includes("demo")))return [m,{error:"This server has no line history for that game."}];
      if(!r.ok||!j)return [m,{error:(j&&typeof j.detail==="string"&&j.detail)||`HTTP ${r.status}`}];
      return [m,j];
    }catch(e){return [m,{error:String(e.message||e)}];}
  }));
  HIST[k]=got.length&&got.every(([,d])=>d.error)?{state:"error",msg:got[0][1].error}
    :{state:"ready",open:true,markets:Object.fromEntries(got)};
  if(want===league)render();
}
async function loadProps(g,spend){
  const k=propKey(g), want=league;
  const live=!(data&&data.demo_mode);
  if(CATALOG&&CATALOG.props_enabled===false&&live){
    PROPS[k]={state:"error",msg:"Props are switched off on the server. Set ENABLE_PROPS=1 to allow them — each market costs a credit per game."};render();return;}
  const base=`/api/props/${encodeURIComponent(want)}/${encodeURIComponent(g.odds_id)}?stake=${encodeURIComponent($("stake").value||10)}&method=${encodeURIComponent($("method").value)}`;
  PROPS[k]={state:"loading"};render();
  try{
    if(live&&!spend){
      // price it first; if the backend can't dry-run, fall through to asking anyway
      const r=await fetch(base+"&dry_run=true"); const j=await r.json().catch(()=>null);
      if(r.ok&&j&&j.dry_run){PROPS[k]={state:"quote",cost:j.estimated_cost};if(want===league)render();return;}
      if(!r.ok)throw new Error((j&&j.detail)||`HTTP ${r.status}`);
    }
    const r=await fetch(base); const j=await r.json().catch(()=>null);
    if(!r.ok||!j)throw new Error((j&&typeof j.detail==="string"&&j.detail)||`HTTP ${r.status}`);
    j.props=Array.isArray(j.props)?j.props:[];
    PROPS[k]={state:"ready",open:true,data:j};
    if(j.usage)setUsage(j.usage);
    if(data&&want===league)updateTracked(data);   // refresh open prop plays' latest price
  }catch(e){PROPS[k]={state:"error",msg:String(e.message||e)};}
  if(want===league)render();
}

    kelly:(a,b)=>(b.kelly||0)-(a.kelly||0),time:(a,b)=>(Date.parse(a.start_utc)||0)-(Date.parse(b.start_utc)||0),
    book:(a,b)=>String(a.book).localeCompare(b.book)||b.ev_per_dollar-a.ev_per_dollar}[s]||((a,b)=>b.ev_per_dollar-a.ev_per_dollar);

/* ---------------- tracking + CLV ----------------
   A tracked play is stored in localStorage with the price you saw. Each board
   refresh before the game starts records that book's current price as the
   latest pre-start snapshot. Once the game starts (ESPN state in/post, or the
   clock passes start time) the last pre-start snapshot becomes the closing line.
   The closing line is only as fresh as your last refresh before first pitch/kickoff. */
const isTracked=k=>tracked.some(t=>t.id===k);

function toggleTrack(k){
  const i=tracked.findIndex(t=>t.id===k);
  if(i>-1){tracked.splice(i,1);}
  else{
    const p=REG[k]; if(!p)return;
    const snap={price:p.price,point:p.point??null,fair_prob:p.fair_prob??null,at:data.generated_at};
    // team names let the results check tell which side of a moneyline/spread you took
    const g=data.games.find(g=>(p.espn_id&&g.espn_id===p.espn_id)||g.name===p.game)||{home:{},away:{}};
    tracked.push({id:k,league,game:p.game,espn_id:p.espn_id??null,odds_id:p.odds_id??g.odds_id??null,
      home:p.home??g.home.name??null,away:p.away??g.away.name??null,start_utc:p.start_utc,market:p.market,
      side:p.side,point:p.point??null,book:p.book,price:p.price,fair_prob:p.fair_prob??null,
      ev_per_dollar:p.ev_per_dollar??null,ev_dollars:p.ev_dollars??null,stake:+(data.stake||$("stake").value||10),
      demo:!!data.demo_mode,logged_at:new Date().toISOString(),last:snap,close:null,closed:false});
  }
  saveTracked();render();
}

function findSide(board,t){
  const g=board.games.find(g=>(t.espn_id&&g.espn_id===t.espn_id)||g.name===t.game);
  if(!g)return {g:null,snap:null};
  const m=g.markets[t.market];
  let s=m&&Array.isArray(m.sides)?m.sides.find(s=>s.label===t.side):null;
  if(!s){  // a prop: look in that game's loaded props panel, if any
    const pr=PROPS[`${t.league}|${g.odds_id}`];
    ((pr&&pr.data&&pr.data.props)||[]).some(p=>p.market===t.market&&p.analysis&&Array.isArray(p.analysis.sides)&&
      (s=p.analysis.sides.find(x=>(p.player?p.player+" ":"")+(x.label??"")===t.side&&(x.point??null)===(t.point??null))));
  }
  const y=s&&Array.isArray(s.your_books)?s.your_books.find(y=>y.book===t.book):null;
  return {g,snap:y?{price:y.price,point:s.point??null,fair_prob:s.fair_prob??null,at:board.generated_at}:null};
}
function hasStarted(t,g){
  if(g&&g.state)return g.state==="in"||g.state==="post";
  if(t.demo)return false;
  const s=Date.parse(t.start_utc);
  return !isNaN(s)&&s<=Date.now();
}
function closeOut(t){t.closed=true;t.close=t.last||null;t.closed_at=new Date().toISOString();}

function updateTracked(board){
  let dirty=false;
  tracked.forEach(t=>{
    if(t.closed||t.league!==league)return;
    const {g,snap}=findSide(board,t);
    if(hasStarted(t,g)){closeOut(t);dirty=true;return;}
    if(snap){t.last=snap;dirty=true;}
  });
  if(dirty)saveTracked();
}
// no refresh needed for the clock to close a live-data play
function closeByClock(){
  let dirty=false;
  tracked.forEach(t=>{if(!t.closed&&hasStarted(t,null)){closeOut(t);dirty=true;}});
  if(dirty)saveTracked();
}

function clvOf(t){
  const c=t.closed?t.close:t.last;
  if(!c||c.price==null)return {c,moved:false,price:null,fair:null};
  const moved=(c.point??null)!==(t.point??null);
  if(moved)return {c,moved,price:null,fair:null};
  return {c,moved,price:dec(t.price)/dec(c.price)-1,
    fair:c.fair_prob!=null?c.fair_prob*dec(t.price)-1:null};
}

const profitOf=t=>t.outcome==="won"?(+t.stake||0)*(dec(t.price)-1):t.outcome==="lost"?-(+t.stake||0):t.outcome==="push"?0:null;
const fmtDay=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric"});};

// Grade tracked plays against final scores (ESPN, free). Only asks about plays
// that don't have a result yet; a game that's final also closes the play.
async function checkResults(force){
  const todo=tracked.filter(t=>!t.outcome&&!(t.result&&t.result.result==="ungradeable"));
  if(resultsBusy||!todo.length)return;
  if(!force&&Date.now()-lastResultsCheck<60000)return;
  resultsBusy=true;resultsErr=null;lastResultsCheck=Date.now();if(tab==="Tracked")render();
  try{
    const r=await fetch("/api/results",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({plays:todo.map(t=>({id:t.id,league:t.league,market:t.market,side:t.side,
        point:t.point,espn_id:t.espn_id,start_utc:t.start_utc,game:t.game,home:t.home,away:t.away}))})});
    const j=await r.json().catch(()=>null);
    if(r.status===404||r.status===405)throw new Error("This server has no /api/results route, so games can't be graded automatically. Grade by hand below.");
    if(!r.ok||!j||typeof j.results!=="object")throw new Error((j&&typeof j.detail==="string"&&j.detail)||`HTTP ${r.status}`);
    tracked.forEach(t=>{const res=j.results[t.id];if(!res)return;
      t.result={...res,checked_at:new Date().toISOString()};
      if(res.status==="final"||res.status==="live"){if(!t.closed)closeOut(t);}
      if(["won","lost","push"].includes(res.result)){t.outcome=res.result;t.graded_by=res.synthetic?"demo":"scores";}
    });
    if(Array.isArray(j.errors)&&j.errors.length)resultsErr=j.errors.map(e=>e.message).join("; ");
    saveTracked();
  }catch(e){resultsErr=String(e.message||e);}
  finally{resultsBusy=false;if(tab==="Tracked")render();}
}

function trackedRows(){return tracked.map(t=>({t,...clvOf(t),pl:profitOf(t)}));}

function renderTracked(){
  closeByClock();
  if(!tracked.length){out.innerHTML=`<div class="empty"><strong>No tracked plays</strong>
    Tap ☆ on any price on the Board or Plays tab to log it here. Refresh the board before the game
    starts and the last price you saw becomes the closing line, so you can see whether you beat it.
    Once the game is final, the Results view grades it from ESPN scores.
    Stored in this browser only.</div>`;return;}
  const view=prefs.tview==="results"?"results":"plays";
  let html=`<div class="tbar"><div class="seg" role="group" aria-label="Tracker view">
      <button data-tview="plays" aria-pressed="${view==="plays"}">Plays</button>
      <button data-tview="results" aria-pressed="${view==="results"}">Results</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" data-act="scores" ${resultsBusy?"disabled":""}>${resultsBusy?"Checking…":"Check scores"}</button>
      <button class="btn" data-act="csv">Export CSV</button></div></div>`;
  if(resultsErr)html+=`<div class="banner caution"><b>Couldn't check every score</b><span>${h(resultsErr)}</span></div>`;
  html+=view==="results"?resultsHTML():trackedPlaysHTML();
  html+=`<div style="text-align:center;margin:14px 0"><button class="btn danger" data-act="clear-tracked">Clear all tracked plays</button></div>`;
  out.innerHTML=html; wire();
}

const clsOf=v=>v==null?"":v>0?"pos":v<0?"neg":"";
function resBadge(t){
  if(t.outcome)return `<span class="res ${t.outcome}">${t.outcome.toUpperCase()}</span>`;
  const st=t.result&&(t.result.result||t.result.status);
  return st?`<span class="res ${h(st)}">${h(st==="ungradeable"?"GRADE BY HAND":st.toUpperCase())}</span>`:"";
}

function trackedPlaysHTML(){
  const rows=trackedRows();
  const closed=rows.filter(r=>r.t.closed);
  const scored=closed.filter(r=>r.fair!=null);
  const beat=closed.filter(r=>r.price!=null);
  const avg=scored.length?scored.reduce((a,r)=>a+r.fair,0)/scored.length:null;
  const entryEV=tracked.reduce((a,t)=>a+(t.ev_dollars||0),0);
  let html=`<div class="sumgrid">
    <div class="stat"><b>${tracked.length}</b><span>tracked · ${tracked.length-closed.length} open</span></div>
    <div class="stat"><b class="${clsOf(avg)}">${spct(avg,2)}</b><span>avg CLV vs fair close</span></div>
    <div class="stat"><b>${beat.length?`${beat.filter(r=>r.price>0).length}/${beat.length}`:"—"}</b><span>beat closing price</span></div>
    <div class="stat"><b class="${clsOf(entryEV)}">${money(entryEV)}</b><span>EV at entry (sum)</span></div></div>
    <div class="banner"><b>How CLV is measured here</b><span>Closing line = the last price your book showed on a board
    refresh before the game started. <i>CLV vs fair</i> is your price against the de-vigged closing probability — positive
    means you got a better number than the market settled on. Research only; nothing is placed.</span></div>`;
  const sorted=rows.slice().sort((a,b)=>(a.t.closed-b.t.closed)||(Date.parse(a.t.start_utc)||0)-(Date.parse(b.t.start_utc)||0));
  html+=sorted.map(({t,c,moved,price,fair})=>{
    const status=t.closed?(c?"Closed":"Closed — no pre-start price captured"):"Open";
    const cur=c?`${t.closed?"Close":"Now"} ${am(c.price)}${c.point!=null?` @ ${fmtPoint(t.market,c.point)}`:""}${c.fair_prob!=null?` (fair ${pct(c.fair_prob)})`:""}`:"";
    return `<div class="tk"><div class="l1"><div>${resBadge(t)}<b>${h(t.side)}${t.point!=null?" "+h(fmtPoint(t.market,t.point)):""}</b>
      · ${h(mname(t.market))} · ${h(t.book)} ${am(t.price)}</div>
      <div class="clv ${clsOf(fair)}" title="CLV vs fair ${t.closed?"close":"(so far)"}">${moved?"line moved":spct(fair,2)}${
        !t.closed&&!moved&&fair!=null?"<small>so far</small>":""}</div></div>
      <div class="l2">${h(t.game)} · ${h(String(t.league).toUpperCase())} · ${fmtDay(t.start_utc)} ${fmtTime(t.start_utc)}${t.demo?" · demo":""}<br>
      <b style="color:var(--chalk)">${status}</b>${cur?` · ${cur}`:""}${price!=null?` · price CLV ${spct(price,2)}`:""}
      ${moved?` · line moved from ${h(fmtPoint(t.market,t.point))} to ${h(fmtPoint(t.market,c.point))}, prices not comparable`:""}<br>
      Logged ${new Date(t.logged_at).toLocaleString()} · entry EV ${spct(t.ev_per_dollar,1)} (${money(t.ev_dollars)} on ${money(t.stake)})</div>
      <div class="acts" style="display:flex;gap:8px;margin-top:8px">
      ${t.closed?"":`<button class="btn" data-lock="${h(t.id)}" title="Use the latest price seen as the closing line now">Lock close now</button>`}
      <button class="btn danger" data-untrack="${h(t.id)}">Remove</button></div></div>`;
  }).join("");
  return html;
}

// ISO-ish week bucket (Monday start) for the summary table
function weekOf(iso){
  const d=new Date(iso); if(isNaN(d))return null;
  const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
  return m.toISOString().slice(0,10);
}

function resultsHTML(){
  const rows=trackedRows();
  const graded=rows.filter(r=>r.t.outcome);
  const w=graded.filter(r=>r.t.outcome==="won").length, l=graded.filter(r=>r.t.outcome==="lost").length,
        pu=graded.filter(r=>r.t.outcome==="push").length;
  const risked=graded.filter(r=>r.t.outcome!=="push").reduce((a,r)=>a+(+r.t.stake||0),0);
  const pl=graded.reduce((a,r)=>a+(r.pl||0),0);
  const closed=rows.filter(r=>r.t.closed&&r.fair!=null);
  const avg=closed.length?closed.reduce((a,r)=>a+r.fair,0)/closed.length:null;
  const synthetic=graded.some(r=>r.t.graded_by==="demo");
  let html=`<div class="sumgrid">
    <div class="stat"><b>${w}-${l}${pu?`-${pu}`:""}</b><span>record (W-L${pu?"-P":""})</span></div>
    <div class="stat"><b class="${clsOf(pl)}">${money(pl)}</b><span>profit at logged stakes</span></div>
    <div class="stat"><b class="${clsOf(pl)}">${risked?spct(pl/risked,1):"—"}</b><span>ROI on ${money(risked)} risked</span></div>
    <div class="stat"><b class="${clsOf(avg)}">${spct(avg,2)}</b><span>avg CLV · ${plural(closed.length,"closed play")}</span></div></div>`;
  if(synthetic)html+=`<div class="banner caution"><b>Demo results are made up</b><span>Demo fixtures never finish, so the server invents a final score per game. Use it to see how grading works, not as a record.</span></div>`;
  html+=`<div class="banner"><span>Over a small sample, win/loss is mostly noise. CLV is the steadier signal: beating the close
    over hundreds of plays is what a real edge looks like. Scores: ESPN. Only moneyline, spread and total grade automatically.</span></div>`;

  // charts: CLV per closed play in the order the games started, and running profit
  const byTime=(a,b)=>(Date.parse(a.t.start_utc)||0)-(Date.parse(b.t.start_utc)||0)||String(a.t.logged_at).localeCompare(b.t.logged_at);
  const cl=closed.slice().sort(byTime);
  let run=0;
  const clvPts=cl.map((r,i)=>{run+=r.fair;return {v:r.fair,avg:run/(i+1),tip:`${r.t.side}${r.t.point!=null?" "+fmtPoint(r.t.market,r.t.point):""} · ${fmtDay(r.t.start_utc)}: CLV ${spct(r.fair,2)} · running avg ${spct(run/(i+1),2)}`};});
  if(clvPts.length)html+=`<div class="chart"><h3>CLV vs fair close, per play</h3>
    <p>Bars: each closed play, oldest first. Line: running average.</p>${barLineSVG(clvPts,v=>spct(v,1))}</div>`;
  let cum=0;
  const plPts=graded.slice().sort(byTime).map(r=>{cum+=r.pl||0;return {avg:cum,tip:`${r.t.side} · ${fmtDay(r.t.start_utc)}: ${r.t.outcome} ${money(r.pl)} · total ${money(cum)}`};});
  if(plPts.length)html+=`<div class="chart"><h3>Cumulative profit</h3><p>Graded plays at the stake you logged.</p>${barLineSVG(plPts,money,true)}</div>`;

  // weekly table (the chart's data, in rows)
  const wk={};
  rows.forEach(r=>{const k=weekOf(r.t.start_utc);if(!k)return;const b=wk[k]=wk[k]||{n:0,clv:[],w:0,l:0,p:0,pl:0};
    b.n++;if(r.t.closed&&r.fair!=null)b.clv.push(r.fair);
    if(r.t.outcome==="won")b.w++;if(r.t.outcome==="lost")b.l++;if(r.t.outcome==="push")b.p++;b.pl+=r.pl||0;});
  const wks=Object.keys(wk).sort().reverse();
  if(wks.length)html+=`<table class="wk"><thead><tr><th>Week of</th><th>Plays</th><th>Avg CLV</th><th>W-L-P</th><th>Profit</th></tr></thead><tbody>`+
    wks.map(k=>{const b=wk[k],a=b.clv.length?b.clv.reduce((x,y)=>x+y,0)/b.clv.length:null;
      return `<tr><td>${fmtDay(k+"T12:00:00")}</td><td>${b.n}</td><td class="${clsOf(a)}">${spct(a,2)}</td>
      <td>${b.w}-${b.l}-${b.p}</td><td class="${clsOf(b.pl)}">${money(b.pl)}</td></tr>`;}).join("")+`</tbody></table>`;

  // every play with its result; hand-grading where scores can't decide
  html+=rows.slice().sort((a,b)=>byTime(b,a)).map(({t,fair,moved,pl})=>{
    const res=t.result||{};
    const score=res.home_score!=null&&res.away_score!=null?`${h(res.away||"Away")} ${res.away_score} – ${h(res.home||"Home")} ${res.home_score}${res.synthetic?" (synthetic)":""}`:"";
    const canHand=!t.outcome&&(t.closed||Date.parse(t.start_utc)<=Date.now()||["final","unknown"].includes(res.status)||res.result==="ungradeable");
    const g=v=>`<button class="btn" data-grade='${h(JSON.stringify([t.id,v]))}'>${v[0].toUpperCase()+v.slice(1)}</button>`;
    return `<div class="tk"><div class="l1"><div>${resBadge(t)}<b>${h(t.side)}${t.point!=null?" "+h(fmtPoint(t.market,t.point)):""}</b>
      · ${h(mname(t.market))} · ${h(t.book)} ${am(t.price)}</div>
      <div class="clv ${clsOf(pl)}">${pl==null?"—":money(pl)}</div></div>
      <div class="l2">${h(t.game)} · ${fmtDay(t.start_utc)}${score?` · ${score}`:""}<br>
      CLV ${moved?"n/a (line moved)":spct(fair,2)} · ${money(t.stake)} stake${t.graded_by?` · graded by ${h(t.graded_by)}`:""}
      ${!t.outcome&&res.detail?`<br>${h(res.detail)}`:""}</div>
      ${canHand?`<div class="acts" style="display:flex;gap:8px;margin-top:8px">${g("won")}${g("lost")}${g("push")}</div>`:""}
      ${t.graded_by==="hand"?`<div class="acts" style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-grade='${h(JSON.stringify([t.id,null]))}'>Undo grade</button></div>`:""}</div>`;
  }).join("");
  return html;
}

// Bars (optional, from .v) plus a line (from .avg) on one shared y-axis with a zero line.
// fitY: scale to the data instead of anchoring at zero (for probabilities, where 0 isn't a reference)
function barLineSVG(pts,fmt,lineOnly,maxW,fitY){
  // drawn at the container's pixel width so the axis text stays legible on a phone
  const W=Math.max(260,Math.min(maxW||1100,(out.clientWidth||640)-26)),H=W<500?150:180,L=48,R=8,T=10,B=18,iw=W-L-R,ih=H-T-B;
  const vals=pts.flatMap(p=>[lineOnly?null:p.v,p.avg]).filter(v=>v!=null);
  let lo=fitY?Math.min(...vals):Math.min(0,...vals),hi=fitY?Math.max(...vals):Math.max(0,...vals);
  if(hi-lo<1e-6){hi+=fitY?.01:1e-9;lo-=fitY?.01:1e-9;}
  const pad=(hi-lo)*.08;hi+=pad;lo-=pad;
  const y=v=>T+(hi-v)/(hi-lo)*ih, step=iw/pts.length, x=i=>L+step*(i+.5);
  const bw=Math.max(2,Math.min(22,step-2));
  let g=`<line class="ax" x1="${L}" x2="${W-R}" y1="${T}" y2="${T}"/><line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${fitY?"":`<line class="zero" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/><text x="${L-6}" y="${y(0)+3}" text-anchor="end">${h(fmt(0))}</text>`}
    ${fitY||y(0)-T>14?`<text x="${L-6}" y="${T+4}" text-anchor="end">${h(fmt(hi))}</text>`:""}
    ${fitY||H-B-y(0)>14?`<text x="${L-6}" y="${H-B}" text-anchor="end">${h(fmt(lo))}</text>`:""}
    <text x="${L}" y="${H-3}">oldest</text><text x="${W-R}" y="${H-3}" text-anchor="end">newest</text>`;
  if(!lineOnly)pts.forEach((p,i)=>{const y0=y(0),y1=y(p.v);
    g+=`<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${p.v>=0?"var(--up)":"var(--down)"}" opacity=".8"/>`;});
  g+=`<polyline fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round" points="${pts.map((p,i)=>`${x(i)},${y(p.avg)}`).join(" ")}"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${x(i)}" cy="${y(p.avg)}" r="${pts.length>40?2:3.5}" fill="var(--brass)" stroke="var(--felt-2)" stroke-width="2"/>
    <rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${ih}"><title>${h(p.tip)}</title></rect>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${h(pts.length+" points; table below has the same data")}">${g}</svg>`;
}

function exportCSV(){
  const cols=["logged_at","league","game","start_utc","market","side","point","book","price","stake",
    "entry_fair_prob","entry_ev_per_dollar","entry_ev_dollars","status","close_price","close_point","close_fair_prob",
    "clv_vs_fair","price_clv","line_moved","result","graded_by","profit","away_score","home_score","demo"];
  // quote when needed; a leading =,+,-,@ on text gets a ' so spreadsheets don't run it as a formula
  const esc=v=>{if(v==null)return "";let s=String(v);if(/^[=+\-@]/.test(s)&&isNaN(+s))s="'"+s;
    return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
  const lines=[cols.join(",")].concat(trackedRows().map(({t,c,moved,price,fair,pl})=>{
    const res=t.result||{};
    const r={logged_at:t.logged_at,league:t.league,game:t.game,start_utc:t.start_utc,market:t.market,side:t.side,
      point:t.point,book:t.book,price:t.price,stake:t.stake,entry_fair_prob:t.fair_prob,entry_ev_per_dollar:t.ev_per_dollar,
      entry_ev_dollars:t.ev_dollars,status:t.closed?"closed":"open",close_price:t.closed&&c?c.price:null,
      close_point:t.closed&&c?c.point:null,close_fair_prob:t.closed&&c?c.fair_prob:null,
      clv_vs_fair:t.closed&&fair!=null?fair.toFixed(5):null,price_clv:t.closed&&price!=null?price.toFixed(5):null,
      line_moved:moved?"yes":"",result:t.outcome||res.result||res.status||"",graded_by:t.graded_by||"",
      profit:pl!=null?pl.toFixed(2):null,away_score:res.away_score,home_score:res.home_score,demo:t.demo?"yes":""};
    return cols.map(k=>esc(r[k])).join(",");}));
  const blob=new Blob([lines.join("\r\n")+"\r\n"],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`betting-desk-tracked-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------------- alerts + auto-refresh ----------------
   Alerts are evaluated on the server for every board (yours and the
   scheduler's), so this page only polls the free /api/alerts and
   /api/scheduler routes. When the scheduler has pulled new lines for the
   league on screen, the board is repriced with cached_only=1: never a credit. */
const POLL_MS=30000;
async function pollAlerts(){
  try{
    const r=await fetch("/api/alerts?limit=200");if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    ALERTS={list:j.alerts||[],unread:j.unread||0,latest:j.latest_id||0,readUpto:j.read_upto||0,
      config:j.config,persisted:j.persisted,loaded:true,err:null};
    // First visit in this browser, or the server's history was reset: don't replay it all as toasts.
    if(alertPrefs.seen==null||alertPrefs.seen>ALERTS.latest)alertPrefs.seen=ALERTS.latest;
    const fresh=ALERTS.list.filter(a=>a.id>alertPrefs.seen).reverse();
    if(fresh.length){alertPrefs.seen=fresh[fresh.length-1].id;announce(fresh);}
    saveAlertPrefs();
    if(tab==="Alerts"&&document.visibilityState==="visible")markRead();
  }catch(e){ALERTS.err=String(e.message||e);}
  repaint();
}
function announce(list){
  const box=$("toasts"),show=list.slice(-3);
  show.forEach(a=>{const d=document.createElement("div");d.className="toast "+(a.kind==="move"?"move":"edge");
    d.setAttribute("role","status");
    d.innerHTML=`<b>${h(a.title)}</b><span>${h(a.detail||"")}</span>`;
    d.onclick=()=>{d.remove();tab="Alerts";savePrefs();render();openAlerts();};
    box.appendChild(d);setTimeout(()=>d.remove(),9000);});
  if(list.length>show.length){const d=document.createElement("div");d.className="toast";
    d.innerHTML=`<b>+${list.length-show.length} more alert${list.length-show.length===1?"":"s"}</b><span>See the Alerts tab.</span>`;
    d.onclick=()=>{d.remove();tab="Alerts";savePrefs();render();openAlerts();};
    box.appendChild(d);setTimeout(()=>d.remove(),9000);}
  if(alertPrefs.notify&&"Notification" in window&&Notification.permission==="granted"){
    try{
      if(list.length>3)new Notification(`Betting Desk: ${list.length} new alerts`,{body:list.slice(-3).map(a=>a.title).join("\n"),tag:"bd-alerts"});
      else list.forEach(a=>new Notification(a.title,{body:a.detail||"",tag:"bd-"+a.id}));
    }catch(e){}
  }
}
async function markRead(){
  if(!ALERTS.unread)return;
  try{const r=await fetch("/api/alerts/read",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({upto:ALERTS.latest})});if(r.ok){ALERTS.unread=0;renderTabs();}}catch(e){}
}
function openAlerts(){pollAlerts();pollScheduler();markRead();}
async function pollScheduler(){
  try{const r=await fetch("/api/scheduler");if(!r.ok)throw new Error(`HTTP ${r.status}`);SCHED=await r.json();}
  catch(e){SCHED={error:String(e.message||e)};}
  repaint();
  applyScheduled();
}
// The scheduler pulled new lines for the league on screen: reprice from cache, for free.
async function applyScheduled(){
  if(!SCHED||!Array.isArray(SCHED.leagues)||!data||busy)return;
  const lg=SCHED.leagues.find(x=>x.league===league);
  if(!lg||!lg.last_run_at||autoApplied[league]===lg.last_run_at)return;
  const seenAt=Date.parse(data.odds_fetched_at||data.generated_at||0)||0;
  if(Date.parse(lg.last_run_at)<=seenAt){autoApplied[league]=lg.last_run_at;return;}
  autoApplied[league]=lg.last_run_at;
  const want=league;
  try{
    const r=await fetch(`/api/board/${want}?stake=${encodeURIComponent($("stake").value||10)}&method=${$("method").value}&cached_only=1`);
    const j=await r.json();
    if(!r.ok||!j||want!==league||busy)return;
    if((j.errors||[]).some(e=>e.source==="odds"))return;   // cache miss: keep what's on screen
    data=normalise(j);data.auto=true;updateTracked(data);render();
  }catch(e){}
}
function renderAuto(){
  const el=$("auto"),s=SCHED;
  el.className="auto";
  if(!s){el.textContent="auto …";return;}
  if(s.error){el.textContent="auto ?";el.title=s.error;return;}
  if(!s.enabled){el.textContent="auto-refresh off";el.title=s.note||"";return;}
  const b=s.budget||{},frac=b.daily?Math.min(1,b.spent_today/b.daily):1;
  el.classList.add("on",frac>=1?"full":frac>=.75?"warn":"ok");
  el.innerHTML=`${s.paused?"paused":"auto"} <span class="meter" aria-hidden="true"><i style="width:${(frac*100).toFixed(0)}%"></i></span> ${b.spent_today}/${b.daily}`;
  el.title=`Auto-refresh: ${b.spent_today} of ${b.daily} credits spent today (resets ${fmtTime(b.resets_at)})`;
}
const ago=iso=>{const t=Date.parse(iso);if(!t)return "";const m=Math.round((Date.now()-t)/60000);
  return m<1?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:fmtDay(iso);};
function notifyState(){
  if(!("Notification" in window))return ["unsupported","This browser has no notifications."];
  if(Notification.permission==="denied")return ["blocked","Blocked in browser settings for this site."];
  if(alertPrefs.notify&&Notification.permission==="granted")return ["on","On for this browser."];
  return ["off","Off. Alerts still show on this page."];
}
async function toggleNotify(){
  if(!("Notification" in window))return;
  if(alertPrefs.notify){alertPrefs.notify=false;saveAlertPrefs();render();return;}
  let p=Notification.permission;
  if(p==="default"){try{p=await Notification.requestPermission();}catch(e){}}
  alertPrefs.notify=p==="granted";saveAlertPrefs();render();
}
function renderAlerts(){

    <div class="form">

      <label>Fair prob moves pts<input id="al-prob" type="number" step="0.5" min="0.5" max="100" value="${c.move_prob!=null?+(c.move_prob*100).toFixed(2):3}"></label>

      <button class="btn" data-act="al-save">Save</button>

    </div>
    <div class="form" style="align-items:center">
      <button class="btn ${ns==="on"?"on":""}" data-act="al-notify" ${ns==="unsupported"||ns==="blocked"?"disabled":""}>

  html+=schedHTML();
  const list=ALERTS.list;
  html+=`<div class="sechead"><h2>History</h2><span>${list.length?`${list.length} alert${list.length===1?"":"s"}${ALERTS.persisted===false?" · demo: kept in memory":""}`:""}</span></div>`;
  if(!ALERTS.loaded)html+=`<div class="skel" style="height:60px"></div>`;
  else if(!list.length)html+=`<div class="empty"><strong>No alerts yet</strong>

  else{
    html+=list.map(a=>`<div class="al ${a.kind==="move"?"move":"edge"}${a.id>(ALERTS.readUpto??Infinity)?" unread":""}">
      <div class="l1"><span>${h(a.title)}</span><small>${h(ago(a.at))}</small></div>
      <div class="l2">${h(a.detail||"")}<br>${h(String(a.league||"").toUpperCase())} · ${a.kind==="move"?"line move":"edge"} ·
      ${a.origin==="scheduled"?"auto-refresh":"your refresh"}${a.start_utc?" · starts "+h(fmtTime(a.start_utc)):""}</div></div>`).join("");
    html+=`<div style="text-align:center;margin:14px 0"><button class="btn danger" data-act="al-clear">Clear alert history</button></div>`;
  }
  out.innerHTML=html;wire();
}
function schedHTML(){
  const s=SCHED;
  if(!s)return `<div class="panel"><h3>Auto-refresh</h3><div class="muted">Loading…</div></div>`;
  if(s.error)return `<div class="panel"><h3>Auto-refresh</h3><div class="muted">${h(s.error)}</div></div>`;
