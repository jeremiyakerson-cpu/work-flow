<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betting Desk</title>
<style>
  :root {
    --bg:#0c0e12; --panel:#14171d; --line:#242933; --ink:#e6e9ef;
    --dim:#8b93a3; --pos:#3ddc91; --neg:#ff6b6b; --warn:#ffc857; --acc:#5aa9ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 var(--mono);padding:0 0 64px}
  header{border-bottom:1px solid var(--line);padding:14px 18px;
         display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
  h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
  .badge{font-size:11px;padding:2px 7px;border-radius:3px;letter-spacing:.06em;
         background:var(--warn);color:#000;font-weight:700}
  .badge.live{background:var(--neg);color:#fff}
  .meta{color:var(--dim);font-size:12px}
  .meta b{color:var(--ink);font-weight:600}
  main{padding:18px;max-width:1500px;margin:0 auto}
  section{background:var(--panel);border:1px solid var(--line);
          border-radius:6px;margin-bottom:18px}
  .head{padding:10px 14px;border-bottom:1px solid var(--line);
        display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .head h2{font-size:12px;margin:0;letter-spacing:.08em;
           text-transform:uppercase;color:var(--dim)}
  .spacer{flex:1}
  label{color:var(--dim);font-size:12px;display:inline-flex;gap:6px;align-items:center}
  input,select,button{font:12px var(--mono);background:#0a0c10;color:var(--ink);
    border:1px solid var(--line);border-radius:4px;padding:5px 8px}
  input[type=number]{width:84px}
  button{cursor:pointer;border-color:#31384a}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.ghost{background:transparent}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:1040px}
  th{text-align:right;padding:8px 10px;color:var(--dim);font-weight:600;
     border-bottom:1px solid var(--line);white-space:nowrap;
     font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  td{text-align:right;padding:7px 10px;border-bottom:1px solid #1b1f27;
     white-space:nowrap}
  tbody tr:hover{background:#171b22}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)}
  .mk{color:var(--dim);font-size:11px}
  .tag{font-size:10px;padding:1px 5px;border:1px solid var(--line);
       border-radius:3px;color:var(--dim);margin-left:6px}
  .tag.sharp{border-color:#2d4a63;color:var(--acc)}
  .tag.cons{border-color:#5c4a1e;color:var(--warn)}
  .note{padding:10px 14px;color:var(--warn);font-size:12px;
        border-top:1px solid var(--line);line-height:1.6}
  .note.plain{color:var(--dim)}
  .empty{padding:26px 14px;color:var(--dim);text-align:center}
  .busy{opacity:.45;transition:opacity .12s}
  .kv{display:flex;flex-wrap:wrap;gap:20px;padding:12px 14px}
  .kv div{min-width:104px}
  .kv span{display:block;color:var(--dim);font-size:11px;
           text-transform:uppercase;letter-spacing:.04em}
  .kv strong{font-size:16px;font-weight:600}
  .legs{list-style:none;margin:0;padding:0 14px 12px}
  .legs li{display:flex;gap:10px;align-items:center;padding:6px 0;
           border-bottom:1px solid #1b1f27;font-size:12px}
  .legs li:last-child{border-bottom:0}
  .legs .g{flex:1;color:var(--dim)}
  .legs .p{color:var(--ink);min-width:56px;text-align:right}
  .err{color:var(--neg);padding:12px 14px}
  @media (max-width:640px){ main{padding:10px} header{padding:12px} }
</style>
</head>
<body>
<header>
  <h1>Betting Desk</h1>
  <span id="mode" class="badge">…</span>
  <span class="meta" id="hmeta"></span>
</header>

<main>
  <section>
    <div class="head">
      <h2>Edges</h2>
      <label>stake <input type="number" id="stake" min="1" step="1"></label>
      <label>de-vig
        <select id="method">
          <option value="power">power</option>
          <option value="multiplicative">multiplicative</option>
          <option value="additive">additive</option>
        </select>
      </label>
      <label>min EV/$ <input type="number" id="minev" step="0.005"></label>
      <span class="spacer"></span>
      <button id="refresh">refresh</button>
    </div>
    <div id="edges"><div class="empty">loading…</div></div>
    <div id="edgenotes"></div>
  </section>

  <section>
    <div class="head">
      <h2>Parlay</h2>
      <label>stake <input type="number" id="pstake" min="1" step="1" value="20"></label>
      <span class="spacer"></span>
      <button id="clear" class="ghost">clear legs</button>
    </div>
    <div id="parlay"><div class="empty">Click <b>+parlay</b> on any row to add a leg.</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmtAm = (n) => (n > 0 ? "+" + n : String(n));
const pct = (x) => (x * 100).toFixed(2) + "%";
const sign = (x) => (x > 0 ? "pos" : x < 0 ? "neg" : "dim");
const money = (x) => (x >= 0 ? "$" : "-$") + Math.abs(x).toFixed(2);

let health = null;
let legs = [];
let marketsById = null;
let edgeRows = [];
let lastEdgeQuery = null;
// Rapid clicks fire overlapping requests; without a sequence guard a slow
// earlier response can land last and render a stale leg count.
let parlaySeq = 0;
let edgeSeq = 0;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

async function boot() {
  try {
    health = await api("/api/health");
  } catch (e) {
    $("edges").innerHTML = `<div class="err">Cannot reach the desk: ${e.message}</div>`;
    return;
  }
  $("mode").textContent = health.demo_mode ? "DEMO" : "LIVE";
  $("mode").className = "badge" + (health.demo_mode ? "" : " live");
  $("hmeta").innerHTML =
    `feed <b>${health.feed_source}</b> · ${health.markets} markets · ` +
    `your books <b>${health.your_books.join(", ")}</b> · ` +
    `sharp <b>${health.sharp_book || "none"}</b> · ` +
    `bankroll <b>$${health.bankroll}</b> at <b>${health.kelly_multiplier}×</b> Kelly`;
  $("stake").value = health.default_stake;
  $("minev").value = health.min_ev;
  $("method").value = health.devig_method;
  try {
    const m = await api("/api/markets");
    marketsById = Object.fromEntries(m.markets.map((x) => [x.id, x]));
  } catch (e) {
    $("edges").innerHTML = `<div class="err">Cannot load markets: ${e.message}</div>`;
    return;
  }
  loadEdges();
}

async function loadEdges(force) {
  const q = new URLSearchParams({
    stake: $("stake").value,
    method: $("method").value,
    min_ev: $("minev").value,
  }).toString();
  if (!force && q === lastEdgeQuery) return;
  lastEdgeQuery = q;

  const seq = ++edgeSeq;
  // Mark stale rather than blanking: the old rows stay clickable and there
  // is no content flash on every keystroke-driven refresh.
  $("edges").classList.add("busy");
  let data;
  try {
    data = await api("/api/edges?" + q);
  } catch (e) {
    if (seq !== edgeSeq) return;
    $("edges").classList.remove("busy");
    $("edges").innerHTML = `<div class="err">${e.message}</div>`;
    $("edgenotes").innerHTML = "";
    return;
  }
  if (seq !== edgeSeq) return;
  $("edges").classList.remove("busy");
  renderEdges(data);
}

function renderEdges(d) {
  edgeRows = d.rows;
  if (!d.rows.length) {
    $("edges").innerHTML =
      `<div class="empty">No row clears min EV of ${pct(d.min_ev)}.<br>` +
      `${d.total_rows} prices checked, ${d.positive_ev} of them +EV. ` +
      `Lower the threshold to see the losers too.</div>`;
  } else {
    const rows = d.rows.map((r, i) => {
      const src = r.fair_source.startsWith("sharp")
        ? `<span class="tag sharp">${r.fair_source}</span>`
        : `<span class="tag cons">consensus</span>`;
      const best = r.beat_by_best
        ? `<span class="dim">${fmtAm(r.best_price)} ${r.best_book}</span>`
        : `<span class="dim">—</span>`;
      return `<tr>
        <td class="l">${r.outcome}${src}<div class="mk">${r.market_label}</div></td>
        <td class="l">${r.your_book}</td>
        <td>${fmtAm(r.your_price)}</td>
        <td>${fmtAm(r.fair_price)}</td>
        <td class="dim">${pct(r.fair_prob)}</td>
        <td class="${sign(r.ev_per_dollar)}">${pct(r.ev_per_dollar)}</td>
        <td class="${sign(r.ev_dollars)}">${money(r.ev_dollars)}</td>
        <td>${r.kelly > 0 ? money(r.kelly_stake) : '<span class="dim">—</span>'}</td>
        <td class="dim">${pct(r.hold_at_your_book)}</td>
        <td class="l">${best}</td>
        <td><button class="ghost" data-add="${i}">+parlay</button></td>
      </tr>`;
    }).join("");
    $("edges").innerHTML = `<div class="wrap"><table>
      <thead><tr>
        <th class="l">Outcome / market</th><th class="l">Book</th><th>Price</th>
        <th>Fair</th><th>Fair&nbsp;p</th><th>EV/$</th><th>EV</th>
        <th>${d.kelly_multiplier}× Kelly</th><th>Hold</th>
        <th class="l">Better elsewhere</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const notes = [];
  notes.push(`<div class="note plain">${d.shown} of ${d.total_rows} prices shown · ` +
    `${d.positive_ev} +EV · de-vig <b>${d.method}</b> · stake $${d.stake}</div>`);
  if (d.consensus_only_markets.length) {
    notes.push(`<div class="note">No sharp price for ` +
      `${d.consensus_only_markets.join(", ")} — those rows are graded against a ` +
      `consensus of the other books, which is a weaker benchmark.</div>`);
  }
  if (d.method === "additive") {
    notes.push(`<div class="note">Additive de-vig subtracts the same amount from ` +
      `every outcome, so it understates longshots and can push a deep longshot ` +
      `below zero probability. Power is the safer default.</div>`);
  }
  if (d.skipped.length) {
    notes.push(`<div class="note plain">Skipped: ` +
      d.skipped.map((s) => s.market_id).join(", ") +
      ` — not quoted at your books.</div>`);
  }
  $("edgenotes").innerHTML = notes.join("");
}

function addLeg(row) {
  if (legs.some((l) => l.market_id === row.market_id && l.outcome === row.outcome
                    && l.book === row.your_book)) return;
  legs.push({
    market_id: row.market_id,
    outcome_index: null,
    outcome: row.outcome,
    book: row.your_book,
    label: row.market_label,
  });
  loadParlay();
}

async function loadParlay() {
  if (!legs.length) {
    $("parlay").innerHTML =
      `<div class="empty">Click <b>+parlay</b> on any row to add a leg.</div>`;
    return;
  }
  const seq = ++parlaySeq;
  const payload = {
    stake: Number($("pstake").value) || 20,
    method: $("method").value,
    legs: legs.map((l) => ({
      market_id: l.market_id,
      outcome_index: marketsById[l.market_id].outcomes.indexOf(l.outcome),
      book: l.book,
    })),
  };
  let r;
  try {
    r = await api("/api/parlay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    if (seq !== parlaySeq) return;
    $("parlay").innerHTML = `<div class="err">${e.message}</div>`;
    return;
  }
  if (seq !== parlaySeq) return;
  renderParlay(r);
}

function renderParlay(r) {
  const ev = r.ev_dollars === null
    ? `<div><span>EV</span><strong class="dim">n/a</strong></div>`
    : `<div><span>EV</span><strong class="${sign(r.ev_dollars)}">${money(r.ev_dollars)}</strong></div>`;
  const fair = r.fair_prob === null
    ? `<div><span>Fair p</span><strong class="dim">n/a</strong></div>`
    : `<div><span>Fair p</span><strong>${pct(r.fair_prob)}</strong></div>`;
  const hold = r.total_hold === null
    ? `<div><span>Total hold</span><strong class="dim">n/a</strong></div>`
    : `<div><span>Total hold</span><strong class="neg">${pct(r.total_hold)}</strong></div>`;

  const items = r.legs_detail.map((l, i) => `<li>
      <span class="g">${l.outcome} <span class="dim">· ${l.label} · ${l.book}</span></span>
      <span class="p">${fmtAm(l.american)}</span>
      <button class="ghost" data-drop="${i}">×</button>
    </li>`).join("");

  $("parlay").innerHTML = `
    <div class="kv">
      <div><span>Legs</span><strong>${r.legs}</strong></div>
      <div><span>Price</span><strong>${fmtAm(r.american)}</strong></div>
      <div><span>Decimal</span><strong>${r.decimal}</strong></div>
      <div><span>Returns</span><strong>${money(r.to_return)}</strong></div>
      <div><span>Breakeven p</span><strong>${pct(r.breakeven_prob)}</strong></div>
      ${fair}${ev}${hold}
    </div>
    <ul class="legs">${items}</ul>
    ${r.notes.map((n) => `<div class="note">${n}</div>`).join("")}`;

}

// Delegated once, on containers that are never replaced. Binding onclick
// per button loses the handler whenever the panel re-renders between a
// click being dispatched and the row being read.
$("edges").addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-add]");
  if (!btn) return;
  const row = edgeRows[+btn.dataset.add];
  if (row) addLeg(row);
});
$("parlay").addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-drop]");
  if (!btn) return;
  legs.splice(+btn.dataset.drop, 1);
  loadParlay();
});

$("refresh").onclick = () => loadEdges(true);
["stake", "method", "minev"].forEach((id) => {
  $(id).onchange = () => loadEdges(false);
});
$("pstake").onchange = loadParlay;
$("clear").onclick = () => { legs = []; loadParlay(); };
boot();
</script>
</body>
</html>
