      ${b.credits_left!=null?`Stops at ${b.reserve} credits left this month (now ${b.credits_left}).`:""}</div>
    <div class="meterbig ${frac>=1?"full":frac>=.75?"warn":""}" role="meter" aria-valuemin="0" aria-valuemax="${b.daily}" aria-valuenow="${b.spent_today}" aria-label="Credits spent today"><i style="width:${(frac*100).toFixed(0)}%"></i></div>
    <table class="sch"><tr><th>League</th><th>Next game</th><th>Every</th><th>Next run</th><th></th></tr>
    ${(s.leagues||[]).map(l=>`<tr><td>${h(LEAGUE_LABELS[l.league]||l.league)}</td>
      <td>${l.next_start?h(fmtTime(l.next_start)):"—"}</td><td>${l.interval_min?l.interval_min+" min":"—"}</td>
      <td>${l.waiting?`<span class="muted">${h(l.waiting)}</span>`:l.next_run_at?h(fmtTime(l.next_run_at)):"—"}
        ${l.error?`<br><span class="neg">${h(l.error)}</span>`:""}</td>
      <td><button class="btn" data-sch-run="${h(l.league)}">Run now</button></td></tr>`).join("")}</table>
    <div class="form"><button class="btn" data-act="${s.paused?"sch-resume":"sch-pause"}">${s.paused?"Resume":"Pause"}</button></div>
    ${runs.length?`<div class="muted" style="margin-top:8px">Recent: ${runs.map(r=>
      `${h(LEAGUE_LABELS[r.league]||r.league)} ${h(ago(r.at))} · ${r.ok?`${r.cost} cr, ${r.plays} plays${r.alerts?`, ${r.alerts} alerts`:""}`:`failed: ${h(r.error||"")}`}`).join("<br>")}</div>`:""}
  </div>`;
}
async function saveAlertConfig(){
  const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?null:v;};
  const body={enabled:$("al-on").checked};
  const e=num("al-edge"),p=num("al-prob"),pt=num("al-pts");
  if(e!=null)body.min_edge=Math.max(0,Math.min(100,e))/100;
  if(p!=null&&p>0)body.move_prob=Math.min(100,p)/100;
  if(pt!=null&&pt>0)body.move_points=Math.min(50,pt);
  try{const r=await fetch("/api/alerts/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:`HTTP ${r.status}`);
    ALERTS.config=j.config;ALERTS.err=null;}
  catch(e){ALERTS.err=`Saving settings failed: ${e.message||e}`;}
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();render();
}
async function schedAction(path){
  try{const r=await fetch(path,{method:"POST"});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:`HTTP ${r.status}`);}
  catch(e){ALERTS.err=String(e.message||e);}
  await pollScheduler();pollAlerts();
}
function pollAll(){if(document.visibilityState==="visible"){pollAlerts();pollScheduler();}}
setInterval(pollAll,POLL_MS);
document.addEventListener("visibilitychange",pollAll);

/* ---------------- wiring ---------------- */
function wire(){
  out.querySelectorAll("[data-slip]").forEach(el=>el.onclick=()=>toggleSlip(el.dataset.slip));
  out.querySelectorAll("[data-track]").forEach(el=>el.onclick=e=>{e.stopPropagation();toggleTrack(el.dataset.track);});
  out.querySelectorAll("[data-untrack]").forEach(el=>el.onclick=()=>{
    tracked=tracked.filter(t=>t.id!==el.dataset.untrack);saveTracked();render();});
  out.querySelectorAll("[data-lock]").forEach(el=>el.onclick=()=>{
    const t=tracked.find(t=>t.id===el.dataset.lock);if(t){closeOut(t);saveTracked();render();}});
  out.querySelectorAll("[data-props]").forEach(el=>el.onclick=()=>{
    const g=data&&data.games.find(g=>String(g.odds_id)===el.dataset.props);if(g)loadProps(g,!!el.dataset.spend);});
  out.querySelectorAll("[data-hist]").forEach(el=>el.onclick=()=>{
    const g=data&&data.games.find(g=>String(g.odds_id)===el.dataset.hist);if(g)loadHistory(g);});
  out.querySelectorAll("[data-props-close]").forEach(el=>el.onclick=()=>{
    const k=`${league}|${el.dataset.propsClose}`,pr=PROPS[k];
    if(pr&&pr.state==="ready")pr.open=!pr.open;else delete PROPS[k];render();});
  out.querySelectorAll("[data-grade]").forEach(el=>el.onclick=()=>{
    const [id,res]=JSON.parse(el.dataset.grade);const t=tracked.find(t=>t.id===id);if(!t)return;
    if(res){t.outcome=res;t.graded_by="hand";if(!t.closed)closeOut(t);}else{t.outcome=null;t.graded_by=null;}
    saveTracked();render();});
  out.querySelectorAll("[data-tview]").forEach(el=>el.onclick=()=>{
    prefs.tview=el.dataset.tview;savePrefs();render();if(prefs.tview==="results")checkResults(false);});
  out.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==="retry")refresh();
    if(a==="inj"){inj=null;render();loadInjuries();}
    if(a==="scores")checkResults(true);
    if(a==="csv")exportCSV();
    if(a==="clear-tracked"&&confirm("Remove every tracked play from this browser?")){tracked=[];saveTracked();render();}
    if(a==="al-save")saveAlertConfig();
    if(a==="al-edge-from-filter"){$("al-edge").value=+prefs.edge||0;saveAlertConfig();}
    if(a==="al-notify")toggleNotify();
    if(a==="al-clear"&&confirm("Clear the alert history for everyone using this server?"))
      fetch("/api/alerts",{method:"DELETE"}).then(pollAlerts,pollAlerts);
    if(a==="sch-pause")schedAction("/api/scheduler/pause");
    if(a==="sch-resume")schedAction("/api/scheduler/resume");
  });
  out.querySelectorAll("[data-sch-run]").forEach(el=>el.onclick=()=>{el.disabled=true;
    schedAction(`/api/scheduler/run/${encodeURIComponent(el.dataset.schRun)}`);});
}

function toggleSlip(k){
  const i=slip.findIndex(l=>l.id===k);
  if(i>-1)slip.splice(i,1);
  else{const p=REG[k];if(!p)return;
    slip.push({id:k,label:p.label||p.side,american:+p.price,fair_prob:p.fair_prob??null,
      game:p.game,game_id:p.espn_id||p.game,time:p.start_utc});}
  render();priceSlip();
}

let slipSeq=0;
async function priceSlip(){
  const stake=+($("pstake").value||10), seq=++slipSeq;
  $("barlegs").textContent=slip.length?`${slip.length} leg${slip.length>1?"s":""}`:"No legs yet";
  if(!slip.length){
    $("barprice").textContent="—";$("barsub").textContent="Tap any price to add a leg";
    $("legs").innerHTML=`<p style="font-size:13px;opacity:.7">Empty.</p>`;
    $("tot").innerHTML="";$("warn").innerHTML="";return;
  }
  $("legs").innerHTML="";
  slip.forEach((l,i)=>{const d=document.createElement("div");d.className="leg";
    d.innerHTML=`<div><div class="pk">${h(l.label)}</div><div class="mt">${h(l.game)} · ${fmtTime(l.time)}</div>
      <button>Remove</button></div><div class="od">${am(l.american)}</div>`;
    d.querySelector("button").onclick=()=>{slip.splice(i,1);render();priceSlip();};
    $("legs").appendChild(d);});
  let j;
  try{
    const r=await fetch("/api/parlay",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({stake,legs:slip.map(l=>({label:l.label,american:l.american,
        fair_prob:l.fair_prob,game_id:l.game_id}))})});
    j=await r.json(); if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:`HTTP ${r.status}`);
  }catch(e){
    if(seq!==slipSeq)return;
    $("barprice").textContent="—";$("barsub").textContent="Couldn't price the slip";
    $("tot").innerHTML="";$("warn").textContent=`Pricing failed: ${e.message||e}`;return;
  }
  if(seq!==slipSeq)return;
  $("barprice").textContent=am(j.american);
  $("barsub").textContent=`${money(stake)} returns ${money(j.to_return)}`;
  const evColor=j.ev_dollars==null?"inherit":(j.ev_dollars>=0?"#1F7A3A":"#B23A25");
  $("tot").innerHTML=`
    <div class="trow"><span>Price</span><b>${am(j.american)}</b></div>
    <div class="trow"><span>Book implied chance</span><span>${pct(j.book_implied_prob)}</span></div>
    ${j.fair_prob!=null?`<div class="trow"><span>Fair chance</span><span>${pct(j.fair_prob)}</span></div>
    <div class="trow"><span>Total hold</span><span>${pct(j.total_hold)}</span></div>
    <div class="trow"><span>Expected value</span><span style="color:${evColor}">${money(j.ev_dollars)}</span></div>
    <div class="trow"><span>Same money as singles</span><span style="color:${evColor}">${
      j.as_singles&&j.as_singles.total_ev_dollars!=null?money(j.as_singles.total_ev_dollars):"—"}</span></div>`
    :`<div class="trow"><span>Expected value</span><span style="opacity:.6">not computed — a leg has no fair price</span></div>`}
    <div class="trow big"><span>To return</span><span>${money(j.to_return)}</span></div>`;
  $("warn").innerHTML=(j.notes||[]).map(h).join("<br>")||
    "Each leg you add multiplies the book's margin against you.";
}

function fmtTime(iso){
  if(!iso)return "";
  const d=new Date(iso); if(isNaN(d))return "";
  return d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});
}

$("bar").onclick=()=>{$("sheet").classList.add("open");$("scrim").classList.add("open");};
const shut=()=>{$("sheet").classList.remove("open");$("scrim").classList.remove("open");};
$("close").onclick=shut;$("scrim").onclick=shut;
$("pstake").oninput=priceSlip;
$("clear").onclick=()=>{slip=[];render();priceSlip();shut();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut();});
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(tab==="Tracked"&&prefs.tview==="results")render();},150);});
$("note").textContent="Schedules, scores and injuries: ESPN, free. Odds: The Odds API, "+
  "billed per credit. Research only — nothing here places a bet or touches a sportsbook account.";
render();priceSlip();loadUsage();loadCatalog();pollAlerts();pollScheduler();
if(tab==="Tracked")checkResults(false);
if(tab==="Injuries")loadInjuries();
if(tab==="Alerts")markRead();
</script>
